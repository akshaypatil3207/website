<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>

  <style>

    /* ==========================================================================
       SECTION 1: COLOR PALETTE & GLOBAL STYLES
       ========================================================================== */

    :root {
      /* Background colors */
      --bg-main: #0a0a12;          /* 95% Dark background */
      --card-bg: #141322;          /* Dark purplish container surface */
      --card-hover: #1f1d36;       /* Elevated purple for hover states */

      /* Text & Accent colors */
      --accent-cyan: #00f3ff;      /* Bright fluorescent cyan */
      --accent-glow: rgba(0, 243, 255, 0.35); /* Neon glow effect */
      --text-white: #ffffff;       /* Pure white heading text */
      --text-muted: #a0a0c0;       /* Muted ice blue secondary text */
      --border-color: #272545;    /* Subtle dark border */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }




    /* ==========================================================================
       SECTION 2: HEADER & NAVIGATION TABS (SPA NAVBAR)
       ========================================================================== */

    header {
      background: rgba(20, 19, 34, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Site Title / Logo */
    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 1px;
    }

    .brand-title span {
      color: var(--accent-cyan); /* Highlight word in neon cyan */
    }

    /* Main Section Buttons (Videos, Photos, Status) */
    .nav-tabs {
      display: flex;
      gap: 15px;
      list-style: none;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      color: var(--accent-cyan);
    }

    .nav-btn.active {
      background: var(--card-hover);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-glow);
    }




    /* ==========================================================================
       SECTION 3: PAGE LAYOUT & TRANSITION EFFECTS
       ========================================================================== */

    main {
      flex: 1;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Controls page visibility (SPA) */
    .page-section {
      display: none; /* Hidden by default; JavaScript shows active section */
      animation: fadeIn 0.4s ease-in-out;
    }

    .page-section.active {
      display: block;
    }

    /* Smooth Fade-in animation when switching tabs */
    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: translateY(12px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }




    /* ==========================================================================
       SECTION 4: VIDEOS PAGE - DYNAMIC CATEGORY FILTER BUTTONS
       ========================================================================== */

    .category-filter {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      min-height: 45px;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cat-btn:hover, 
    .cat-btn.active {
      background: var(--accent-cyan);
      color: #000000; /* Black font on bright background for high contrast */
      font-weight: bold;
      box-shadow: 0 0 12px var(--accent-glow);
    }




    /* ==========================================================================
       SECTION 5: VIDEOS PAGE - YOUTUBE STYLE GRID & CARDS
       ========================================================================== */

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    /* 16:9 Thumbnail Container */
    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Maintains 16:9 aspect ratio */
      background-color: #000000;
    }

    .thumbnail-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Play Button Hover Icon */
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 52px;
      height: 52px;
      background: rgba(0, 243, 255, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .play-icon::after {
      content: '';
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent #000000;
      margin-left: 3px;
    }

    .video-card:hover .play-icon {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Video Text Details Inside Card */
    .video-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .video-category-tag {
      align-self: flex-start;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .video-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-white);
    }

    .video-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Loading or Error Messages */
    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1.6;
    }




    /* ==========================================================================
       SECTION 6: POPUP LIGHTBOX PLAYER (MODAL)
       ========================================================================== */

    .video-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .video-modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 950px;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 0 35px var(--accent-glow);
    }

    .player-container {
      position: relative;
      padding-top: 56.25%; /* 16:9 ratio for embedded player */
      width: 100%;
      background: #000000;
    }

    .player-container iframe,
    .player-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-modal-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      color: var(--text-white);
      font-size: 2.2rem;
      cursor: pointer;
      z-index: 1010;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-modal-btn:hover {
      color: var(--accent-cyan);
    }

  </style>
</head>
<body>

  <!-- ==========================================================================
       HTML SECTION 1: HEADER & NAVIGATION TABS
       ========================================================================== -->

  <header>
    <div class="brand-title">MY<span>SHOWCASE</span></div>
    
    <!-- Top Navigation Buttons -->
    <ul class="nav-tabs">
      <li>
        <button class="nav-btn active" onclick="switchSection('videos-section', this)">Videos</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('photos-section', this)">Photos</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('status-section', this)">Status</button>
      </li>
    </ul>
  </header>




  <!-- ==========================================================================
       HTML SECTION 2: MAIN CONTENT CONTAINER
       ========================================================================== -->

  <main>

    <!-- ------------------------------------------------------------------------
         PAGE 1: VIDEOS SECTION
         ------------------------------------------------------------------------ -->
    <section id="videos-section" class="page-section active">
      
      <!-- Dynamic category tabs will be automatically created here by JS -->
      <div id="category-filter" class="category-filter"></div>

      <!-- Video cards will be dynamically injected here -->
      <div id="video-grid" class="video-grid">
        <div class="status-msg">Loading videos from Google Sheet...</div>
      </div>

    </section>




    <!-- ------------------------------------------------------------------------
         PAGE 2: PHOTOS SECTION (PLACEHOLDER FOR FUTURE MODULE)
         ------------------------------------------------------------------------ -->
    <section id="photos-section" class="page-section">
      <h2 style="color: var(--accent-cyan); margin-bottom: 10px;">Photos Gallery</h2>
      <p style="color: var(--text-muted);">This section will be populated in the next development step.</p>
    </section>




    <!-- ------------------------------------------------------------------------
         PAGE 3: STATUS SECTION (PLACEHOLDER FOR FUTURE MODULE)
         ------------------------------------------------------------------------ -->
    <section id="status-section" class="page-section">
      <h2 style="color: var(--accent-cyan); margin-bottom: 10px;">Status Updates</h2>
      <p style="color: var(--text-muted);">This section will be populated in the next development step.</p>
    </section>

  </main>




  <!-- ==========================================================================
       HTML SECTION 3: POPUP VIDEO PLAYER MODAL
       ========================================================================== -->

  <div id="video-modal" class="video-modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-modal-btn" onclick="closeModal()">&times;</span>
      <div id="player-container" class="player-container">
        <!-- Iframe or HTML5 Video injected dynamically when card is clicked -->
      </div>
    </div>
  </div>




  <!-- ==========================================================================
       JAVASCRIPT SECTION: BACKEND LOGIC & DYNAMIC RENDERING
       ========================================================================== -->

  <script>

    /* 
       --------------------------------------------------------------------------
       1. GOOGLE SHEET CONFIGURATION
       --------------------------------------------------------------------------
       Paste your published Google Sheet CSV link below inside the quotes.
    */
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTluqmzTR4sguXw7Wyr3x6lEFmrLvmJ2zcRDLTXxtFal4p1M1BfoDAxXFb3dZU5uZVDp7F9W4AIIk44/pub?output=csv';

    // Global array to store parsed video objects
    let allVideos = [];




    /* 
       --------------------------------------------------------------------------
       2. SPA SECTION NAVIGATION (Videos / Photos / Status)
       --------------------------------------------------------------------------
    */
    function switchSection(sectionId, btnElement) {
      // Hide all page sections
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));

      // Remove active highlight from all header buttons
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      // Show the selected section and highlight its button
      document.getElementById(sectionId).classList.add('active');
      btnElement.classList.add('active');
    }




    /* 
       --------------------------------------------------------------------------
       3. FETCH CSV DATA FROM GOOGLE SHEETS
       --------------------------------------------------------------------------
    */
    async function loadVideos() {
      const grid = document.getElementById('video-grid');

      // Validation check to make sure placeholder text was replaced
      if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes('PASTE_YOUR_PUBLISHED_CSV_URL_HERE')) {
        grid.innerHTML = `<div class="status-msg">⚠️ Please replace <b>GOOGLE_SHEET_CSV_URL</b> in the code with your published Google Sheet CSV link.</div>`;
        return;
      }

      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();

        // Convert raw text into structured JSON array
        allVideos = parseCSV(csvText);

        if (allVideos.length === 0) {
          grid.innerHTML = `<div class="status-msg">No videos found in your spreadsheet.<br>Verify Row 1 headers: <b>Title, VideoURL, Category, ThumbnailURL, Description</b></div>`;
          return;
        }

        // Generate category buttons dynamically from backend values
        renderCategoryButtons();

        // Render all video cards into the grid
        renderVideoCards(allVideos);

      } catch (err) {
        console.error('Fetch error:', err);
        grid.innerHTML = `<div class="status-msg">Error loading videos from Google Sheets.<br>Verify your sheet is Published to Web as CSV.</div>`;
      }
    }




    /* 
       --------------------------------------------------------------------------
       4. CSV TEXT PARSER
       --------------------------------------------------------------------------
    */
    function parseCSV(csvText) {
      const lines = csvText.trim().split('\n');
      if (lines.length < 2) return [];

      // Extract column headers from Row 1
      const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
      const results = [];

      for (let i = 1; i < lines.length; i++) {
        // Regex handles comma separated values wrapped inside quotes
        const values = lines[i].match(/(".*?"|[^",\r\n]+)(?=\s*,|\s*$)/g) || [];
        if (values.length === 0) continue;

        const row = {};
        headers.forEach((header, index) => {
          let val = values[index] ? values[index].trim() : '';
          val = val.replace(/^"|"$/g, '').replace(/""/g, '"'); // Remove quotes
          row[header] = val;
        });

        // Only add rows that have at least a Title and a VideoURL
        if (row.Title && row.VideoURL) {
          results.push(row);
        }
      }

      return results;
    }




    /* 
       --------------------------------------------------------------------------
       5. DYNAMIC CATEGORY BUTTON GENERATOR
       --------------------------------------------------------------------------
    */
    function renderCategoryButtons() {
      const filterContainer = document.getElementById('category-filter');

      // Extract unique categories from the video list
      const uniqueCategories = [
        'All',
        ...new Set(
          allVideos
            .map(video => video.Category ? video.Category.trim() : '')
            .filter(cat => cat !== '')
        )
      ];

      filterContainer.innerHTML = ''; // Clear container

      // Build a filter button for each category found in the backend
      uniqueCategories.forEach((category, index) => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${index === 0 ? 'active' : ''}`; // 'All' is active by default
        btn.textContent = category;
        btn.onclick = (e) => filterCategory(category, e.target);
        filterContainer.appendChild(btn);
      });
    }




    /* 
       --------------------------------------------------------------------------
       6. RENDER VIDEO CARDS IN THE GRID
       --------------------------------------------------------------------------
    */
    function renderVideoCards(videos) {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '';

      if (videos.length === 0) {
        grid.innerHTML = `<div class="status-msg">No videos found under this category.</div>`;
        return;
      }

      videos.forEach(video => {
        const youtubeId = extractYouTubeID(video.VideoURL);

        // Determine thumbnail: Custom URL > Auto YouTube HQ Thumbnail > Placeholder
        let thumbUrl = video.ThumbnailURL;
        if (!thumbUrl && youtubeId) {
          thumbUrl = `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;
        } else if (!thumbUrl) {
          thumbUrl = 'https://via.placeholder.com/400x225/141322/00f3ff?text=No+Thumbnail';
        }

        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => openModal(video.VideoURL, youtubeId);

        card.innerHTML = `
          <div class="thumbnail-wrapper">
            <img src="${thumbUrl}" alt="${video.Title}" loading="lazy">
            <div class="play-icon"></div>
          </div>
          <div class="video-info">
            <span class="video-category-tag">${video.Category || 'General'}</span>
            <div class="video-title">${video.Title}</div>
            <div class="video-desc">${video.Description || ''}</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }




    /* 
       --------------------------------------------------------------------------
       7. CATEGORY FILTERING LOGIC
       --------------------------------------------------------------------------
    */
    function filterCategory(category, btnElement) {
      // Update active button state
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      // Filter array and re-render grid
      if (category === 'All') {
        renderVideoCards(allVideos);
      } else {
        const filtered = allVideos.filter(v => 
          v.Category && v.Category.trim().toLowerCase() === category.toLowerCase()
        );
        renderVideoCards(filtered);
      }
    }




    /* 
       --------------------------------------------------------------------------
       8. POPUP LIGHTBOX PLAYER MODAL (OPEN / CLOSE)
       --------------------------------------------------------------------------
    */
    function openModal(videoUrl, youtubeId) {
      const modal = document.getElementById('video-modal');
      const container = document.getElementById('player-container');

      if (youtubeId) {
        // Embed YouTube player
        container.innerHTML = `
          <iframe 
            src="https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>`;
      } else {
        // Embed standard HTML5 video player for MP4 / OneDrive direct streams
        container.innerHTML = `
          <video controls autoplay name="media">
            <source src="${videoUrl}" type="video/mp4">
            Your browser does not support playing this video.
          </video>`;
      }

      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('video-modal');
      const container = document.getElementById('player-container');

      modal.classList.remove('active');
      container.innerHTML = ''; // Clear container to stop audio/video playback immediately
    }




    /* 
       --------------------------------------------------------------------------
       9. HELPER: YOUTUBE LINK PARSER
       --------------------------------------------------------------------------
    */
    function extractYouTubeID(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }




    /* 
       --------------------------------------------------------------------------
       10. INITIALIZATION ON PAGE LOAD
       --------------------------------------------------------------------------
    */
    window.addEventListener('DOMContentLoaded', loadVideos);

  </script>
</body>
</html>
