<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Showcase</title>

  <style>
    /* ==========================================================================
       1. COLOR PALETTE & GLOBAL VARIABLES
       ========================================================================== */
    :root {
      --bg-main: #0a0a12;       /* 95% Dark background */
      --card-bg: #141322;       /* Dark purplish container surface */
      --card-hover: #1f1d36;    /* Lighter purplish for hover states */
      --accent-cyan: #00f3ff;   /* Neon fluorescent cyan */
      --accent-glow: rgba(0, 243, 255, 0.35); /* Neon glow effect */
      --text-white: #ffffff;    /* Primary font color */
      --text-muted: #a0a0c0;    /* Secondary font color */
      --border-color: #272545; /* Subtle card borders */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================================
       2. TOP NAVIGATION BAR (SPA Sections: Videos, Photos, Status)
       ========================================================================== */
    header {
      background: rgba(20, 19, 34, 0.85);
      backdrop-filter: blur(10px); /* Blur effect when scrolling */
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 1px;
    }

    .brand-title span {
      color: var(--accent-cyan);
    }

    /* Main Section Tabs */
    .nav-tabs {
      display: flex;
      gap: 15px;
      list-style: none;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      color: var(--accent-cyan);
    }

    .nav-btn.active {
      background: var(--card-hover);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* ==========================================================================
       3. MAIN CONTAINER & SECTION SWITCHING
       ========================================================================== */
    main {
      flex: 1;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .page-section {
      display: none; /* Controlled by JavaScript to show active section */
      animation: fadeIn 0.4s ease-in-out;
    }

    .page-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       4. VIDEOS PAGE: CATEGORY FILTER TABS
       ========================================================================== */
    .category-filter {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cat-btn:hover, .cat-btn.active {
      background: var(--accent-cyan);
      color: #000000; /* Black text on neon background for high contrast */
      font-weight: bold;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ==========================================================================
       5. VIDEO CARDS GRID (YOUTUBE STYLE)
       ========================================================================== */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    /* Thumbnail Area */
    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000;
    }

    .thumbnail-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Play Button Overlay on Hover */
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 50px;
      height: 50px;
      background: rgba(0, 243, 255, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .play-icon::after {
      content: '';
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent #000;
      margin-left: 3px;
    }

    .video-card:hover .play-icon {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Card Text Details */
    .video-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .video-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-white);
    }

    .video-category-tag {
      align-self: flex-start;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .video-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2; /* Truncate after 2 lines */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Status Message for Loading or Errors */
    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* ==========================================================================
       6. LIGHTBOX VIDEO PLAYER MODAL (PAUSE/PLAY/FULLSCREEN SUPPORT)
       ========================================================================== */
    .video-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .video-modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .player-container {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      width: 100%;
      background: #000;
    }

    .player-container iframe,
    .player-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-modal-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      color: var(--text-white);
      font-size: 2rem;
      cursor: pointer;
      z-index: 1010;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-modal-btn:hover {
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       MAIN TOP NAVIGATION (SPA HEADER)
       ========================================================================== -->
  <header>
    <div class="brand-title">MY<span>HUB</span></div>
    <ul class="nav-tabs">
      <li><button class="nav-btn active" onclick="switchSection('videos-section', this)">Videos</button></li>
      <li><button class="nav-btn" onclick="switchSection('photos-section', this)">Photos</button></li>
      <li><button class="nav-btn" onclick="switchSection('status-section', this)">Status</button></li>
    </ul>
  </header>

  <main>
    <!-- ==========================================================================
         SECTION 1: VIDEOS PAGE
         ========================================================================== -->
    <section id="videos-section" class="page-section active">
      
      <!-- Category Filter Buttons -->
      <div class="category-filter">
        <button class="cat-btn active" onclick="filterCategory('All', this)">All</button>
        <button class="cat-btn" onclick="filterCategory('Politics', this)">Politics</button>
        <button class="cat-btn" onclick="filterCategory('Sprituality', this)">Spirituality</button>
        <button class="cat-btn" onclick="filterCategory('Environment', this)">Environment</button>
        <button class="cat-btn" onclick="filterCategory('Self Help', this)">Self Help</button>
      </div>

      <!-- Video Grid where cards are appended dynamically -->
      <div id="video-grid" class="video-grid">
        <div class="status-msg">Loading videos from Google Sheet...</div>
      </div>
    </section>

    <!-- ==========================================================================
         SECTION 2: PHOTOS PLACEHOLDER (FOR FUTURE MODULE)
         ========================================================================== -->
    <section id="photos-section" class="page-section">
      <h2 style="color: var(--accent-cyan);">Photos Gallery</h2>
      <p style="color: var(--text-muted); margin-top: 10px;">Photos module will be constructed next!</p>
    </section>

    <!-- ==========================================================================
         SECTION 3: STATUS PLACEHOLDER (FOR FUTURE MODULE)
         ========================================================================== -->
    <section id="status-section" class="page-section">
      <h2 style="color: var(--accent-cyan);">Status & Updates</h2>
      <p style="color: var(--text-muted); margin-top: 10px;">Status module will be constructed after Photos!</p>
    </section>
  </main>

  <!-- ==========================================================================
       POPUP VIDEO PLAYER MODAL
       ========================================================================== -->
  <div id="video-modal" class="video-modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-modal-btn" onclick="closeModal()">&times;</span>
      <div id="player-container" class="player-container">
        <!-- Player iframe/video element dynamically injected here -->
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       JAVASCRIPT: LOGIC & GOOGLE SHEET FETCHING
       ========================================================================== -->
<script>
    // 1. YOUR PUBLISHED GOOGLE SHEET CSV LINK
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTluqmzTR4sguXw7Wyr3x6lEFmrLvmJ2zcRDLTXxtFal4p1M1BfoDAxXFb3dZU5uZVDp7F9W4AIIk44/pub?output=csv';

    let allVideos = []; // Stores all video data parsed from Google Sheets

    // --------------------------------------------------------------------------
    // SPA NAVIGATION SWITCHER
    // --------------------------------------------------------------------------
    function switchSection(sectionId, btnElement) {
      // Hide all sections
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
      // Remove active class from header buttons
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      // Show selected section
      document.getElementById(sectionId).classList.add('active');
      btnElement.classList.add('active');
    }

    // --------------------------------------------------------------------------
    // FETCH AND PARSE GOOGLE SHEETS CSV DATA
    // --------------------------------------------------------------------------
    async function loadVideos() {
      const grid = document.getElementById('video-grid');

      // Check if URL is missing or still using default placeholder
      if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes('PASTE_YOUR_PUBLISHED_CSV_URL_HERE')) {
        grid.innerHTML = `<div class="status-msg">⚠️ Please replace <b>GOOGLE_SHEET_CSV_URL</b> in the HTML code with your published Google Sheet CSV link.</div>`;
        return;
      }

      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvData = await response.text();

        // Convert raw CSV text into array of objects
        allVideos = parseCSV(csvData);

        if (allVideos.length === 0) {
          grid.innerHTML = `<div class="status-msg">No videos found in your spreadsheet. Make sure Row 1 has headers: Title, VideoURL, Category, ThumbnailURL, Description</div>`;
          return;
        }

        renderVideoCards(allVideos);
      } catch (err) {
        console.error('Error fetching CSV:', err);
        grid.innerHTML = `<div class="status-msg">Error loading videos. Verify your Google Sheet is Published to Web as CSV.</div>`;
      }
    }

    // Helper: Parses CSV text into array of JSON objects handling quoted fields
    function parseCSV(csvText) {
      const lines = csvText.trim().split('\n');
      if (lines.length < 2) return [];

      const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
      const results = [];

      for (let i = 1; i < lines.length; i++) {
        // Regex handles values that contain commas wrapped in quotes
        const values = lines[i].match(/(".*?"|[^",\r\n]+)(?=\s*,|\s*$)/g) || [];
        if (values.length === 0) continue;

        const row = {};
        headers.forEach((header, index) => {
          let val = values[index] ? values[index].trim() : '';
          val = val.replace(/^"|"$/g, '').replace(/""/g, '"'); // Clean double quotes
          row[header] = val;
        });

        if (row.Title && row.VideoURL) {
          results.push(row);
        }
      }
      return results;
    }

    // --------------------------------------------------------------------------
    // RENDER VIDEO CARDS
    // --------------------------------------------------------------------------
    function renderVideoCards(videos) {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '';

      if (videos.length === 0) {
        grid.innerHTML = `<div class="status-msg">No videos found under this category.</div>`;
        return;
      }

      videos.forEach(video => {
        const youtubeId = extractYouTubeID(video.VideoURL);
        
        // Auto-generate YouTube thumbnail if custom ThumbnailURL is blank
        let thumbUrl = video.ThumbnailURL;
        if (!thumbUrl && youtubeId) {
          thumbUrl = `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;
        } else if (!thumbUrl) {
          thumbUrl = 'https://via.placeholder.com/400x225/141322/00f3ff?text=No+Thumbnail';
        }

        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => openModal(video.VideoURL, youtubeId);

        card.innerHTML = `
          <div class="thumbnail-wrapper">
            <img src="${thumbUrl}" alt="${video.Title}" loading="lazy">
            <div class="play-icon"></div>
          </div>
          <div class="video-info">
            <span class="video-category-tag">${video.Category || 'General'}</span>
            <div class="video-title">${video.Title}</div>
            <div class="video-desc">${video.Description || ''}</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Helper: Extract YouTube ID from multiple link formats
    function extractYouTubeID(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // --------------------------------------------------------------------------
    // CATEGORY FILTERING LOGIC
    // --------------------------------------------------------------------------
    function filterCategory(category, btnElement) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      if (category === 'All') {
        renderVideoCards(allVideos);
      } else {
        const filtered = allVideos.filter(v => 
          v.Category && v.Category.trim().toLowerCase() === category.toLowerCase()
        );
        renderVideoCards(filtered);
      }
    }

    // --------------------------------------------------------------------------
    // POPUP MODAL PLAYER (PAUSE/PLAY/FULLSCREEN)
    // --------------------------------------------------------------------------
    function openModal(videoUrl, youtubeId) {
      const modal = document.getElementById('video-modal');
      const container = document.getElementById('player-container');

      if (youtubeId) {
        // Render YouTube Embed
        container.innerHTML = `
          <iframe 
            src="https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>`;
      } else {
        // Render HTML5 Video for Direct MP4 / OneDrive Links
        container.innerHTML = `
          <video controls autoplay name="media">
            <source src="${videoUrl}" type="video/mp4">
            Your browser does not support the video tag.
          </video>`;
      }

      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('video-modal');
      const container = document.getElementById('player-container');
      
      modal.classList.remove('active');
      container.innerHTML = ''; // Destroy video player to stop audio
    }

    // Load data on page load
    window.addEventListener('DOMContentLoaded', loadVideos);
  </script>
</body>
</html>
