<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>

  <style>

    /* ==========================================================================
       SECTION 1: COLOR PALETTE & GLOBAL STYLES
       ========================================================================== */

    :root {
      /* Background colors */
      --bg-main: #0a0a12;          /* 95% Dark background */
      --card-bg: #141322;          /* Dark purplish container surface */
      --card-hover: #1f1d36;       /* Elevated purple for hover states */

      /* Text & Accent colors */
      --accent-cyan: #00f3ff;      /* Bright fluorescent cyan */
      --accent-glow: rgba(0, 243, 255, 0.35); /* Neon glow effect */
      --text-white: #ffffff;       /* Pure white heading text */
      --text-muted: #a0a0c0;       /* Muted ice blue secondary text */
      --border-color: #272545;    /* Subtle dark border */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }




    /* ==========================================================================
       SECTION 2: HEADER & NAVIGATION TABS (SPA NAVBAR)
       ========================================================================== */

    header {
      background: rgba(20, 19, 34, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Site Title / Logo */
    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 1px;
    }

    .brand-title span {
      color: var(--accent-cyan); /* Highlight word in neon cyan */
    }

    /* Main Section Buttons (Videos, Shorts, Photos, Status) */
    .nav-tabs {
      display: flex;
      gap: 12px;
      list-style: none;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      color: var(--accent-cyan);
    }

    .nav-btn.active {
      background: var(--card-hover);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-glow);
    }




    /* ==========================================================================
       SECTION 3: PAGE LAYOUT & TRANSITION EFFECTS
       ========================================================================== */

    main {
      flex: 1;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Controls page visibility (SPA) */
    .page-section {
      display: none; /* Hidden by default; JavaScript shows active section */
      animation: fadeIn 0.4s ease-in-out;
    }

    .page-section.active {
      display: block;
    }

    /* Smooth Fade-in animation when switching tabs */
    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: translateY(12px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }




    /* ==========================================================================
       SECTION 4: DYNAMIC CATEGORY FILTER BUTTONS & HEADINGS
       ========================================================================== */

    .category-filter {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      min-height: 45px;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cat-btn:hover, 
    .cat-btn.active {
      background: var(--accent-cyan);
      color: #000000; /* Black font on bright background for high contrast */
      font-weight: bold;
      box-shadow: 0 0 12px var(--accent-glow);
    }




    /* ==========================================================================
       SECTION 5: YOUTUBE STYLE GRID & CARDS
       ========================================================================== */

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    /* 16:9 Thumbnail Container */
    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Maintains 16:9 aspect ratio */
      background-color: #000000;
    }

    .thumbnail-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Play Button Hover Icon */
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 52px;
      height: 52px;
      background: rgba(0, 243, 255, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .play-icon::after {
      content: '';
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent #000000;
      margin-left: 3px;
    }

    .video-card:hover .play-icon {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Video Text Details Inside Card */
    .video-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .video-category-tag {
      align-self: flex-start;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .video-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-white);
    }

    .video-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Loading or Error Messages */
    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1.6;
    }




    /* ==========================================================================
       SECTION 6: POPUP LIGHTBOX PLAYER (MODAL)
       ========================================================================== */

    .video-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .video-modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 950px;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 0 35px var(--accent-glow);
    }

    .player-container {
      position: relative;
      padding-top: 56.25%; /* 16:9 ratio for embedded player */
      width: 100%;
      background: #000000;
    }

    .player-container iframe,
    .player-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-modal-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      color: var(--text-white);
      font-size: 2.2rem;
      cursor: pointer;
      z-index: 1010;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-modal-btn:hover {
      color: var(--accent-cyan);
    }

  </style>
</head>
<body>

  <!-- ==========================================================================
       HTML SECTION 1: HEADER & NAVIGATION TABS
       ========================================================================== -->

  <header>
    <div class="brand-title">MY<span>SHOWCASE</span></div>
    
    <!-- Top Navigation Buttons -->
    <ul class="nav-tabs">
      <li>
        <button class="nav-btn active" onclick="switchSection('videos-section', this)">Videos</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('shorts-section', this)">Shorts</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('photos-section', this)">Photos</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('status-section', this)">Status</button>
      </li>
    </ul>
  </header>




  <!-- ==========================================================================
       HTML SECTION 2: MAIN CONTENT CONTAINER
       ========================================================================== -->

  <main>

    <!-- PAGE 1: VIDEOS SECTION -->
    <section id="videos-section" class="page-section active">
      <div id="category-filter-videos" class="category-filter"></div>
      <div id="video-grid" class="video-grid">
        <div class="status-msg">Loading videos from DB...</div>
      </div>
    </section>

    <!-- PAGE 2: SHORTS SECTION -->
    <section id="shorts-section" class="page-section">
      <div id="category-filter-shorts" class="category-filter"></div>
      <div id="shorts-grid" class="video-grid">
        <div class="status-msg">Loading shorts from DB...</div>
      </div>
    </section>

    <!-- PAGE 3: PHOTOS SECTION -->
    <section id="photos-section" class="page-section">
      <h2 style="color: var(--accent-cyan); margin-bottom: 10px;">Photos Gallery</h2>
      <p style="color: var(--text-muted);">This section will be populated in the next development step.</p>
    </section>

    <!-- PAGE 4: STATUS SECTION -->
    <section id="status-section" class="page-section">
      <h2 style="color: var(--accent-cyan); margin-bottom: 10px;">Status Updates</h2>
      <p style="color: var(--text-muted);">This section will be populated in the next development step.</p>
    </section>

  </main>




  <!-- ==========================================================================
       HTML SECTION 3: POPUP VIDEO PLAYER MODAL
       ========================================================================== -->

  <div id="video-modal" class="video-modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-modal-btn" onclick="closeModal()">&times;</span>
      <div id="player-container" class="player-container">
        <!-- Iframe or HTML5 Video injected dynamically when card is clicked -->
      </div>
    </div>
  </div>




  <!-- ==========================================================================
       JAVASCRIPT SECTION: BACKEND LOGIC & DYNAMIC RENDERING
       ========================================================================== -->

  <script>

    /* 
       --------------------------------------------------------------------------
       1. GOOGLE SHEET CONFIGURATION
       --------------------------------------------------------------------------
    */
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9maPUHMbAkZTS4c72grAzJvX3pCMQCIfSPXzb7lRH2vEILq4OuoAsF1zPtFEMHkleJkqRr0iZLfvy/pub?output=csv';

    let allItems = [];

    // Fallback SVG if no thumbnail is available
    const FALLBACK_SVG = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225"><rect width="400" height="225" fill="#141322"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#00f3ff" font-family="sans-serif" font-size="16">No Thumbnail</text></svg>');




    /* 
       --------------------------------------------------------------------------
       2. SPA SECTION NAVIGATION
       --------------------------------------------------------------------------
    */
    function switchSection(sectionId, btnElement) {
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(sectionId).classList.add('active');
      btnElement.classList.add('active');
    }




    /* 
       --------------------------------------------------------------------------
       3. FETCH CSV DATA FROM GOOGLE SHEETS
       --------------------------------------------------------------------------
    */
    async function loadContent() {
      const videoGrid = document.getElementById('video-grid');
      const shortsGrid = document.getElementById('shorts-grid');

      if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes('PASTE_YOUR_PUBLISHED_CSV_URL_HERE')) {
        const msg = `<div class="status-msg">⚠️ Please replace <b>GOOGLE_SHEET_CSV_URL</b> with your published Google Sheet CSV link.</div>`;
        videoGrid.innerHTML = msg;
        shortsGrid.innerHTML = msg;
        return;
      }

      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();

        allItems = parseCSV(csvText);

        if (allItems.length === 0) {
          videoGrid.innerHTML = `<div class="status-msg">No items found in DB. Verify Row 1 headers: <b>Title, VideoURL, Category, ThumbnailURL, Description, Type</b></div>`;
          shortsGrid.innerHTML = `<div class="status-msg">No shorts found in DB.</div>`;
          return;
        }

        renderSection('videos');
        renderSection('shorts');

      } catch (err) {
        console.error('Fetch error:', err);
        const errMsg = `<div class="status-msg">Error loading content from DB.<br>Verify your sheet is Published to Web as CSV.</div>`;
        videoGrid.innerHTML = errMsg;
        shortsGrid.innerHTML = errMsg;
      }
    }




    /* 
       --------------------------------------------------------------------------
       4. ACCURATE CSV PARSER (PRESERVES BLANK CELLS & FILTERS OUT 'PRIVATE')
       --------------------------------------------------------------------------
    */
    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/);
      if (lines.length < 2) return [];

      const rawHeaders = parseCSVLine(lines[0]);
      const results = [];

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);

        const row = {};
        rawHeaders.forEach((header, index) => {
          let val = values[index] ? values[index].trim() : '';
          val = val.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
          
          const cleanHeader = header.toLowerCase().replace(/[^a-z0-9]/g, '');
          
          if (['title'].includes(cleanHeader)) row.Title = val;
          if (['videourl', 'video', 'link', 'url'].includes(cleanHeader)) row.VideoURL = val;
          if (['category', 'cat'].includes(cleanHeader)) row.Category = val;
          if (['thumbnailurl', 'thumbnail', 'thumb', 'image', 'img'].includes(cleanHeader)) row.ThumbnailURL = val;
          if (['description', 'desc'].includes(cleanHeader)) row.Description = val;
          if (['type'].includes(cleanHeader)) row.Type = val;
        });

        // Skip Private entries
        if (row.Type && row.Type.toLowerCase() === 'private') {
          continue;
        }

        if (row.Title && row.VideoURL) {
          results.push(row);
        }
      }

      return results;
    }

    function parseCSVLine(text) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cur);
          cur = '';
        } else {
          cur += c;
        }
      }
      result.push(cur);
      return result;
    }




    /* 
       --------------------------------------------------------------------------
       5. RENDER SECTION (CATEGORIES + GRID CARDS)
       --------------------------------------------------------------------------
    */
    function renderSection(sectionType, selectedCategory = 'All') {
      const isShorts = sectionType === 'shorts';
      const gridId = isShorts ? 'shorts-grid' : 'video-grid';
      const filterId = isShorts ? 'category-filter-shorts' : 'category-filter-videos';

      // Filter by Type
      const sectionItems = allItems.filter(item => {
        const t = (item.Type || '').toLowerCase().trim();
        if (isShorts) {
          return t === 'shorts' || t === 'short';
        } else {
          return t === 'videos' || t === 'video' || t === '';
        }
      });

      // Build category buttons
      const filterContainer = document.getElementById(filterId);
      const uniqueCategories = [
        'All',
        ...new Set(
          sectionItems
            .map(item => item.Category ? item.Category.trim() : '')
            .filter(cat => cat !== '')
        )
      ];

      filterContainer.innerHTML = '';
      uniqueCategories.forEach(category => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${category.toLowerCase() === selectedCategory.toLowerCase() ? 'active' : ''}`;
        btn.textContent = category;
        btn.onclick = () => renderSection(sectionType, category);
        filterContainer.appendChild(btn);
      });

      // Filter by Category
      let finalItems = sectionItems;
      if (selectedCategory !== 'All') {
        finalItems = sectionItems.filter(v => 
          v.Category && v.Category.trim().toLowerCase() === selectedCategory.toLowerCase()
        );
      }

      // Render Grid
      const grid = document.getElementById(gridId);
      grid.innerHTML = '';

      if (finalItems.length === 0) {
        grid.innerHTML = `<div class="status-msg">No ${isShorts ? 'shorts' : 'videos'} found in this category.</div>`;
        return;
      }

      finalItems.forEach(video => {
        const youtubeId = extractYouTubeID(video.VideoURL);
        let thumbUrl = formatCustomThumbnail(video.ThumbnailURL);

        if (!thumbUrl && youtubeId) {
          thumbUrl = `https://i.ytimg.com/vi/${youtubeId}/hqdefault.jpg`;
        } else if (!thumbUrl) {
          thumbUrl = FALLBACK_SVG;
        }

        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => openModal(video.VideoURL, youtubeId);

        card.innerHTML = `
          <div class="thumbnail-wrapper">
            <img src="${thumbUrl}" alt="${video.Title}" loading="lazy" onerror="this.onerror=null; this.src='${FALLBACK_SVG}';">
            <div class="play-icon"></div>
          </div>
          <div class="video-info">
            <span class="video-category-tag">${video.Category || 'General'}</span>
            <div class="video-title">${video.Title}</div>
            <div class="video-desc">${video.Description || ''}</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }




    /* 
       --------------------------------------------------------------------------
       6. HELPER: FORMAT CUSTOM THUMBNAIL URLS
       --------------------------------------------------------------------------
    */
    function formatCustomThumbnail(url) {
      if (!url) return '';
      let clean = url.trim();

      if (clean.includes('drive.google.com')) {
        const driveId = extractGoogleDriveID(clean);
        if (driveId) {
          return `https://lh3.googleusercontent.com/d/${driveId}`;
        }
      }
      return clean;
    }




    /* 
       --------------------------------------------------------------------------
       7. POPUP LIGHTBOX PLAYER MODAL (HANDLES YOUTUBE, GOOGLE DRIVE & DIRECT MP4)
       --------------------------------------------------------------------------
    */
    function openModal(videoUrl, youtubeId) {
      const modal = document.getElementById('video-modal');
      const container = document.getElementById('player-container');

      let finalUrl = videoUrl.trim();
      const driveId = extractGoogleDriveID(finalUrl);

      if (youtubeId) {
        // YouTube Player
        container.innerHTML = `
          <iframe 
            src="https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>`;
      } else if (driveId) {
        // Google Drive Player (Embed Preview)
        container.innerHTML = `
          <iframe 
            src="https://drive.google.com/file/d/${driveId}/preview" 
            allow="autoplay" 
            allowfullscreen>
          </iframe>`;
      } else {
        // Direct MP4 / OneDrive Video Stream Player
        if (finalUrl.includes('onedrive.live.com/embed')) {
          finalUrl = finalUrl.replace('/embed', '/download');
        }

        container.innerHTML = `
          <video controls autoplay style="width:100%; height:100%;">
            <source src="${finalUrl}" type="video/mp4">
            Your browser does not support this video stream format.
          </video>`;
      }

      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('video-modal');
      const container = document.getElementById('player-container');

      modal.classList.remove('active');
      container.innerHTML = '';
    }




    /* 
       --------------------------------------------------------------------------
       8. URL ID PARSERS (YOUTUBE & GOOGLE DRIVE)
       --------------------------------------------------------------------------
    */
    function extractYouTubeID(url) {
      if (!url) return null;
      const cleanUrl = url.trim();
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = cleanUrl.match(regExp);
      return (match && match[1]) ? match[1] : null;
    }

    function extractGoogleDriveID(url) {
      if (!url) return null;
      const cleanUrl = url.trim();
      const match = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return (match && match[1]) ? match[1] : null;
    }




    /* 
       --------------------------------------------------------------------------
       9. INITIALIZATION
       --------------------------------------------------------------------------
    */
    window.addEventListener('DOMContentLoaded', loadContent);

  </script>
</body>
</html>
