<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Showcase</title>

  <!-- Romantic Handwriting Font for Book Notes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">

  <style>

    /* ==========================================================================
       SECTION 1: COLOR PALETTE & GLOBAL STYLES
       ========================================================================== */

    :root {
      --bg-main: #0a0a12;          /* 95% Dark background */
      --card-bg: #141322;          /* Dark purplish container surface */
      --card-hover: #1f1d36;       /* Elevated purple for hover states */

      --accent-cyan: #00f3ff;      /* Bright fluorescent cyan */
      --accent-glow: rgba(0, 243, 255, 0.35); /* Neon glow effect */
      --text-white: #ffffff;       /* Pure white heading text */
      --text-muted: #a0a0c0;       /* Muted ice blue secondary text */
      --border-color: #272545;    /* Subtle dark border */
      
      --font-notes: 'Caveat', cursive; /* Handwritten font for book notes */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }




    /* ==========================================================================
       SECTION 2: HEADER & NAVIGATION TABS (SPA NAVBAR)
       ========================================================================== */

    header {
      background: rgba(20, 19, 34, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 1px;
    }

    .brand-title span {
      color: var(--accent-cyan);
    }

    .nav-tabs {
      display: flex;
      gap: 12px;
      list-style: none;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      color: var(--accent-cyan);
    }

    .nav-btn.active {
      background: var(--card-hover);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-glow);
    }




    /* ==========================================================================
       SECTION 3: PAGE LAYOUT & TRANSITION EFFECTS
       ========================================================================== */

    main {
      flex: 1;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .page-section {
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    .page-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: translateY(12px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }




    /* ==========================================================================
       SECTION 4: DYNAMIC CATEGORY FILTER BUTTONS
       ========================================================================== */

    .category-filter {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      min-height: 45px;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cat-btn:hover, 
    .cat-btn.active {
      background: var(--accent-cyan);
      color: #000000;
      font-weight: bold;
      box-shadow: 0 0 12px var(--accent-glow);
    }




    /* ==========================================================================
       SECTION 5: CARDS & GRIDS (VIDEOS, SHORTS, & BOOKS)
       ========================================================================== */

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    /* Books grid uses portrait-oriented cards */
    .books-grid {
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    /* Standard 16:9 Thumbnail for Videos/Shorts */
    .thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000000;
    }

    /* 2:3 Aspect Ratio for Book Covers */
    .book-thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 150%; 
      background-color: #000000;
    }

    .thumbnail-wrapper img,
    .book-thumbnail-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Play Icon Hover Overlay */
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 52px;
      height: 52px;
      background: rgba(0, 243, 255, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .play-icon::after {
      content: '';
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent #000000;
      margin-left: 3px;
    }

    .card:hover .play-icon {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .card-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .category-tag {
      align-self: flex-start;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-white);
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1.6;
    }




    /* ==========================================================================
       SECTION 6: MODAL LIGHTBOX & BOOK READER STYLES
       ========================================================================== */

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 100%;
      max-width: 950px;
      max-height: 90vh;
      background: var(--card-bg);
      border-radius: 12px;
      overflow-y: auto;
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 0 35px var(--accent-glow);
      padding: 30px;
    }

    /* Special size for Video Modal */
    .modal-content.video-modal-content {
      padding: 0;
      overflow: hidden;
    }

    .close-modal-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      color: var(--text-white);
      font-size: 2.2rem;
      cursor: pointer;
      z-index: 1010;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-modal-btn:hover {
      color: var(--accent-cyan);
    }

    .player-container {
      position: relative;
      padding-top: 56.25%;
      width: 100%;
      background: #000000;
    }

    .player-container iframe,
    .player-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* --------------------------------------------------------------------------
       BOOK MODAL: FLOAT LAYOUT & 3D FLIP CARD
       -------------------------------------------------------------------------- */
    
    .clearfix::after {
      content: "";
      clear: both;
      display: table;
    }

    .book-cover-container {
      float: left;
      width: 230px;
      margin-right: 30px;
      margin-bottom: 20px;
      perspective: 1000px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 335px;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }

    .flip-front, .flip-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 8px;
      overflow: hidden;
      background: #000000;
      border: 1px solid var(--border-color);
    }

    .flip-front img, .flip-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .flip-back {
      transform: rotateY(180deg);
    }

    .flip-btn {
      margin-top: 12px;
      width: 100%;
      padding: 9px;
      background: var(--card-hover);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
    }

    .flip-btn:hover {
      background: var(--accent-cyan);
      color: #000000;
    }

    .book-header-info {
      margin-bottom: 20px;
    }

    .book-header-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 6px;
    }

    .book-header-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 8px;
    }

    /* --------------------------------------------------------------------------
       BOOK NOTES: CURVY FONT & HIGHLIGHTER MARKERS
       -------------------------------------------------------------------------- */
    
    .notes-stream {
      font-family: var(--font-notes);
      font-size: 1.45rem;
      line-height: 1.5;
      letter-spacing: 0.4px;
      color: #ffffff;
      margin-top: 25px;
    }

    .note-line {
      margin-bottom: 28px; /* Large space between highlighted thoughts */
      display: block;
    }

    .note-line mark {
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    /* Fluorescent Green Marker Shades */
    .hl-f-1 { background: rgba(180, 255, 0, 0.28); }
    .hl-f-2 { background: rgba(120, 220, 50, 0.35); }

    /* Orange Marker Shades */
    .hl-o-1 { background: rgba(255, 120, 0, 0.30); }
    .hl-o-2 { background: rgba(230, 90, 20, 0.38); }

    .hl-default { background: rgba(255, 255, 255, 0.12); }

  </style>
</head>
<body>

  <!-- ==========================================================================
       HTML SECTION 1: HEADER & NAVIGATION TABS
       ========================================================================== -->

  <header>
    <div class="brand-title">MY<span>SHOWCASE</span></div>
    
    <ul class="nav-tabs">
      <li>
        <button class="nav-btn active" onclick="switchSection('videos-section', this)">Videos</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('shorts-section', this)">Shorts</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('books-section', this)">Books</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('photos-section', this)">Photos</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('status-section', this)">Status</button>
      </li>
    </ul>
  </header>




  <!-- ==========================================================================
       HTML SECTION 2: MAIN CONTENT PAGES
       ========================================================================== -->

  <main>

    <!-- PAGE 1: VIDEOS SECTION -->
    <section id="videos-section" class="page-section active">
      <div id="category-filter-videos" class="category-filter"></div>
      <div id="video-grid" class="grid-container">
        <div class="status-msg">Loading videos from DB...</div>
      </div>
    </section>

    <!-- PAGE 2: SHORTS SECTION -->
    <section id="shorts-section" class="page-section">
      <div id="category-filter-shorts" class="category-filter"></div>
      <div id="shorts-grid" class="grid-container">
        <div class="status-msg">Loading shorts from DB...</div>
      </div>
    </section>

    <!-- PAGE 3: BOOKS SECTION -->
    <section id="books-section" class="page-section">
      <div id="category-filter-books" class="category-filter"></div>
      <div id="books-grid" class="grid-container books-grid">
        <div class="status-msg">Loading books from DB...</div>
      </div>
    </section>

    <!-- PAGE 4: PHOTOS SECTION -->
    <section id="photos-section" class="page-section">
      <h2 style="color: var(--accent-cyan); margin-bottom: 10px;">Photos Gallery</h2>
      <p style="color: var(--text-muted);">This section will be populated in the next step.</p>
    </section>

    <!-- PAGE 5: STATUS SECTION -->
    <section id="status-section" class="page-section">
      <h2 style="color: var(--accent-cyan); margin-bottom: 10px;">Status Updates</h2>
      <p style="color: var(--text-muted);">This section will be populated in the next step.</p>
    </section>

  </main>




  <!-- ==========================================================================
       HTML SECTION 3: POPUP LIGHTBOX MODAL
       ========================================================================== -->

  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div id="modal-content" class="modal-content" onclick="event.stopPropagation()">
      <span class="close-modal-btn" onclick="closeModal()">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>




  <!-- ==========================================================================
       JAVASCRIPT SECTION: BACKEND LOGIC & DYNAMIC RENDERING
       ========================================================================== -->

  <script>

    /* 
       --------------------------------------------------------------------------
       1. GOOGLE SHEET CONFIGURATION
       --------------------------------------------------------------------------
    */
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9maPUHMbAkZTS4c72grAzJvX3pCMQCIfSPXzb7lRH2vEILq4OuoAsF1zPtFEMHkleJkqRr0iZLfvy/pub?output=csv';

    let allItems = [];

    const FALLBACK_SVG = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225"><rect width="400" height="225" fill="#141322"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#00f3ff" font-family="sans-serif" font-size="16">No Cover Available</text></svg>');




    /* 
       --------------------------------------------------------------------------
       2. SPA SECTION NAVIGATION
       --------------------------------------------------------------------------
    */
    function switchSection(sectionId, btnElement) {
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(sectionId).classList.add('active');
      btnElement.classList.add('active');
    }




    /* 
       --------------------------------------------------------------------------
       3. FETCH CSV DATA FROM GOOGLE SHEETS
       --------------------------------------------------------------------------
    */
    async function loadContent() {
      const videoGrid = document.getElementById('video-grid');
      const shortsGrid = document.getElementById('shorts-grid');
      const booksGrid = document.getElementById('books-grid');

      if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes('PASTE_YOUR_PUBLISHED_CSV_URL_HERE')) {
        const msg = `<div class="status-msg">⚠️ Please replace <b>GOOGLE_SHEET_CSV_URL</b> with your published Google Sheet CSV link.</div>`;
        videoGrid.innerHTML = msg;
        shortsGrid.innerHTML = msg;
        booksGrid.innerHTML = msg;
        return;
      }

      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();

        allItems = parseCSV(csvText);

        if (allItems.length === 0) {
          const emptyMsg = `<div class="status-msg">No items found in DB.</div>`;
          videoGrid.innerHTML = emptyMsg;
          shortsGrid.innerHTML = emptyMsg;
          booksGrid.innerHTML = emptyMsg;
          return;
        }

        renderSection('videos');
        renderSection('shorts');
        renderSection('books');

      } catch (err) {
        console.error('Fetch error:', err);
        const errMsg = `<div class="status-msg">Error loading content from DB.<br>Verify your sheet is Published to Web as CSV.</div>`;
        videoGrid.innerHTML = errMsg;
        shortsGrid.innerHTML = errMsg;
        booksGrid.innerHTML = errMsg;
      }
    }




    /* 
       --------------------------------------------------------------------------
       4. ACCURATE CSV PARSER (MAPS BOOK NOTES & PRESERVES BLANK CELLS)
       --------------------------------------------------------------------------
    */
    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/);
      if (lines.length < 2) return [];

      const rawHeaders = parseCSVLine(lines[0]);
      const results = [];

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);

        const row = {};
        rawHeaders.forEach((header, index) => {
          let val = values[index] ? values[index].trim() : '';
          val = val.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
          
          const cleanHeader = header.toLowerCase().replace(/[^a-z0-9]/g, '');
          
          if (['title', 'name', 'book'].includes(cleanHeader)) row.Title = val;
          if (['videourl', 'video', 'link', 'url', 'frontcover'].includes(cleanHeader)) row.VideoURL = val;
          if (['category', 'cat', 'genre'].includes(cleanHeader)) row.Category = val;
          if (['thumbnailurl', 'thumbnail', 'thumb', 'image', 'img', 'backcover'].includes(cleanHeader)) row.ThumbnailURL = val;
          if (['description', 'desc', 'author', 'summary'].includes(cleanHeader)) row.Description = val;
          if (['type'].includes(cleanHeader)) row.Type = val;
          if (['notes', 'highlights', 'quote', 'quotes'].includes(cleanHeader)) row.Notes = val;
        });

        // Skip Private entries
        if (row.Type && row.Type.toLowerCase() === 'private') {
          continue;
        }

        if (row.Title && (row.VideoURL || row.ThumbnailURL)) {
          results.push(row);
        }
      }

      return results;
    }

    function parseCSVLine(text) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cur);
          cur = '';
        } else {
          cur += c;
        }
      }
      result.push(cur);
      return result;
    }




    /* 
       --------------------------------------------------------------------------
       5. RENDER SECTIONS (VIDEOS, SHORTS, & BOOKS)
       --------------------------------------------------------------------------
    */
    function renderSection(sectionType, selectedCategory = 'All') {
      const isShorts = sectionType === 'shorts';
      const isBooks = sectionType === 'books';

      let gridId = 'video-grid';
      let filterId = 'category-filter-videos';

      if (isShorts) {
        gridId = 'shorts-grid';
        filterId = 'category-filter-shorts';
      } else if (isBooks) {
        gridId = 'books-grid';
        filterId = 'category-filter-books';
      }

      // Filter by Type
      const sectionItems = allItems.filter(item => {
        const t = (item.Type || '').toLowerCase().trim();
        if (isShorts) return t === 'shorts' || t === 'short';
        if (isBooks) return t === 'books' || t === 'book';
        return t === 'videos' || t === 'video' || t === '';
      });

      // Build Category Filter Buttons
      const filterContainer = document.getElementById(filterId);
      const uniqueCategories = [
        'All',
        ...new Set(
          sectionItems
            .map(item => item.Category ? item.Category.trim() : '')
            .filter(cat => cat !== '')
        )
      ];

      filterContainer.innerHTML = '';
      uniqueCategories.forEach(category => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${category.toLowerCase() === selectedCategory.toLowerCase() ? 'active' : ''}`;
        btn.textContent = category;
        btn.onclick = () => renderSection(sectionType, category);
        filterContainer.appendChild(btn);
      });

      // Filter by Category
      let finalItems = sectionItems;
      if (selectedCategory !== 'All') {
        finalItems = sectionItems.filter(v => 
          v.Category && v.Category.trim().toLowerCase() === selectedCategory.toLowerCase()
        );
      }

      // Render Grid
      const grid = document.getElementById(gridId);
      grid.innerHTML = '';

      if (finalItems.length === 0) {
        grid.innerHTML = `<div class="status-msg">No ${sectionType} found in this category.</div>`;
        return;
      }

      finalItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        if (isBooks) {
          // BOOK CARD LAYOUT (2:3 PORTRAIT RATIO)
          const frontCover = formatCustomImageURL(item.VideoURL) || FALLBACK_SVG;
          
          card.onclick = () => openBookModal(item);
          card.innerHTML = `
            <div class="book-thumbnail-wrapper">
              <img src="${frontCover}" alt="${item.Title}" loading="lazy" onerror="this.onerror=null; this.src='${FALLBACK_SVG}';">
            </div>
            <div class="card-info">
              <span class="category-tag">${item.Category || 'Book'}</span>
              <div class="card-title">${item.Title}</div>
              <div class="card-desc">${item.Description || ''}</div>
            </div>
          `;
        } else {
          // VIDEO & SHORT CARD LAYOUT (16:9 RATIO)
          const youtubeId = extractYouTubeID(item.VideoURL);
          let thumbUrl = formatCustomImageURL(item.ThumbnailURL);

          if (!thumbUrl && youtubeId) {
            thumbUrl = `https://i.ytimg.com/vi/${youtubeId}/hqdefault.jpg`;
          } else if (!thumbUrl) {
            thumbUrl = FALLBACK_SVG;
          }

          card.onclick = () => openVideoModal(item.VideoURL, youtubeId);
          card.innerHTML = `
            <div class="thumbnail-wrapper">
              <img src="${thumbUrl}" alt="${item.Title}" loading="lazy" onerror="this.onerror=null; this.src='${FALLBACK_SVG}';">
              <div class="play-icon"></div>
            </div>
            <div class="card-info">
              <span class="category-tag">${item.Category || 'General'}</span>
              <div class="card-title">${item.Title}</div>
              <div class="card-desc">${item.Description || ''}</div>
            </div>
          `;
        }

        grid.appendChild(card);
      });
    }




    /* 
       --------------------------------------------------------------------------
       6. HELPER: FORMAT CUSTOM IMAGE & THUMBNAIL URLS
       --------------------------------------------------------------------------
    */
    function formatCustomImageURL(url) {
      if (!url) return '';
      let clean = url.trim();

      if (clean.includes('drive.google.com')) {
        const driveId = extractGoogleDriveID(clean);
        if (driveId) {
          return `https://lh3.googleusercontent.com/d/${driveId}`;
        }
      }
      return clean;
    }




    /* 
       --------------------------------------------------------------------------
       7. BOOK MODAL READER & HIGHLIGHTER LOGIC
       --------------------------------------------------------------------------
    */
    function openBookModal(book) {
      const modal = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      const body = document.getElementById('modal-body');

      content.classList.remove('video-modal-content');

      const frontCover = formatCustomImageURL(book.VideoURL) || FALLBACK_SVG;
      const backCover = formatCustomImageURL(book.ThumbnailURL) || frontCover;

      const parsedNotes = parseBookNotes(book.Notes);

      body.innerHTML = `
        <div class="clearfix">
          
          <!-- LEFT FLOATING 3D BOOK COVER -->
          <div class="book-cover-container">
            <div id="flip-card-inner" class="flip-card-inner">
              <div class="flip-front">
                <img src="${frontCover}" alt="${book.Title} Front Cover">
              </div>
              <div class="flip-back">
                <img src="${backCover}" alt="${book.Title} Back Cover">
              </div>
            </div>
            <button class="flip-btn" onclick="toggleBookFlip()">Flip to Back Cover</button>
          </div>

          <!-- BOOK TITLE & AUTHOR HEADER -->
          <div class="book-header-info">
            <span class="category-tag">${book.Category || 'Book'}</span>
            <h1 class="book-header-title">${book.Title}</h1>
            <div class="book-header-desc">${book.Description || ''}</div>
          </div>

          <!-- FLOATING HANDWRITTEN HIGHLIGHTED NOTES -->
          <div class="notes-stream">
            ${parsedNotes || '<div style="color:var(--text-muted); font-size:1.1rem; margin-top:20px;">No highlighted notes added for this book yet.</div>'}
          </div>

        </div>
      `;

      modal.classList.add('active');
    }

    // Toggle 3D Cover Flip
    function toggleBookFlip() {
      const cardInner = document.getElementById('flip-card-inner');
      const btn = event.target;

      cardInner.classList.toggle('flipped');
      if (cardInner.classList.contains('flipped')) {
        btn.textContent = 'Flip to Front Cover';
      } else {
        btn.textContent = 'Flip to Back Cover';
      }
    }

    // Parse [F] and [O] Tags with Alternating Color Shades
    function parseBookNotes(notesRaw) {
      if (!notesRaw) return '';

      const sentences = notesRaw.split(';');
      let html = '';

      let lastTag = '';
      let toggleShade = false;

      sentences.forEach(raw => {
        let trimmed = raw.trim();
        if (!trimmed) return;

        let tag = '';
        if (/\[F\]/i.test(trimmed)) {
          tag = 'F';
          trimmed = trimmed.replace(/\[F\]/gi, '').trim();
        } else if (/\[O\]/i.test(trimmed)) {
          tag = 'O';
          trimmed = trimmed.replace(/\[O\]/gi, '').trim();
        }

        // Alternating color shades for consecutive matching tags
        if (tag && tag === lastTag) {
          toggleShade = !toggleShade;
        } else {
          toggleShade = false;
          lastTag = tag;
        }

        let hlClass = 'hl-default';
        if (tag === 'F') {
          hlClass = toggleShade ? 'hl-f-2' : 'hl-f-1';
        } else if (tag === 'O') {
          hlClass = toggleShade ? 'hl-o-2' : 'hl-o-1';
        }

        html += `
          <div class="note-line">
            <mark class="${hlClass}">${trimmed}</mark>
          </div>
        `;
      });

      return html;
    }




    /* 
       --------------------------------------------------------------------------
       8. VIDEO POPUP MODAL
       --------------------------------------------------------------------------
    */
    function openVideoModal(videoUrl, youtubeId) {
      const modal = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      const body = document.getElementById('modal-body');

      content.classList.add('video-modal-content');

      let finalUrl = videoUrl.trim();
      const driveId = extractGoogleDriveID(finalUrl);

      if (youtubeId) {
        body.innerHTML = `
          <div class="player-container">
            <iframe 
              src="https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>
          </div>`;
      } else if (driveId) {
        body.innerHTML = `
          <div class="player-container">
            <iframe 
              src="https://drive.google.com/file/d/${driveId}/preview" 
              allow="autoplay" 
              allowfullscreen>
            </iframe>
          </div>`;
      } else {
        if (finalUrl.includes('onedrive.live.com/embed')) {
          finalUrl = finalUrl.replace('/embed', '/download');
        }

        body.innerHTML = `
          <div class="player-container">
            <video controls autoplay style="width:100%; height:100%;">
              <source src="${finalUrl}" type="video/mp4">
              Your browser does not support this video stream format.
            </video>
          </div>`;
      }

      modal.classList.add('active');
    }

    function closeModal(event) {
      if (event && event.stopPropagation) event.stopPropagation();
      const modal = document.getElementById('modal-overlay');
      const body = document.getElementById('modal-body');

      modal.classList.remove('active');
      body.innerHTML = '';
    }




    /* 
       --------------------------------------------------------------------------
       9. HELPER URL PARSERS
       --------------------------------------------------------------------------
    */
    function extractYouTubeID(url) {
      if (!url) return null;
      const cleanUrl = url.trim();
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = cleanUrl.match(regExp);
      return (match && match[1]) ? match[1] : null;
    }

    function extractGoogleDriveID(url) {
      if (!url) return null;
      const cleanUrl = url.trim();
      const match = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return (match && match[1]) ? match[1] : null;
    }




    /* 
       --------------------------------------------------------------------------
       10. INITIALIZATION
       --------------------------------------------------------------------------
    */
    window.addEventListener('DOMContentLoaded', loadContent);

  </script>
</body>
