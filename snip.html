<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Archive Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0a12;
      --card-bg: #141322;
      --card-hover: #1f1d36;
      --accent-cyan: #00f3ff;
      --accent-glow: rgba(0, 243, 255, 0.35);
      --text-white: #ffffff;
      --text-muted: #d0d0e0;
      --border-color: #272545;
      --font-main: 'Shantell Sans', cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      color: var(--text-white);
    }

    /* Custom Consistent Scrollbars */
    *::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    *::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    *::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: var(--accent-cyan);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(20, 19, 34, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 1px;
    }

    .brand-title span {
      color: var(--accent-cyan);
    }

    .nav-tabs {
      display: flex;
      gap: 12px;
      list-style: none;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      color: var(--accent-cyan);
    }

    .nav-btn.active {
      background: var(--card-hover);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    main {
      flex: 1;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .page-section {
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    .page-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-filter {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      min-height: 45px;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cat-btn:hover, 
    .cat-btn.active {
      background: var(--accent-cyan);
      color: #000000;
      font-weight: bold;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Increased gap between sections by 220% more (192px) */
    .achievement-category-wrapper {
      margin-bottom: 192px;
    }

    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
    }

    /* Card List Layout: Left side photo/video, Right side 3/4th text */
    .collage-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .horizontal-scroll-row {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: row;
      width: 100%;
      min-height: 180px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* No hover zoom or transform effects */
    .card:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    /* Left side photo/video wrapper (1/4th width) */
    .collage-thumbnail-wrapper {
      position: relative;
      flex: 0 0 25%;
      max-width: 25%;
      background-color: #0c0b13;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--border-color);
    }

    .collage-thumbnail-wrapper img,
    .collage-thumbnail-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Right side text area (3/4th width) */
    .card-info {
      flex: 0 0 75%;
      max-width: 75%;
      padding: 20px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .category-tag {
      align-self: flex-start;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.1);
      padding: 3px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-white);
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .status-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1.1rem;
      width: 100%;
    }

    @media (max-width: 768px) {
      .card {
        flex-direction: column;
      }
      .collage-thumbnail-wrapper {
        flex: 0 0 200px;
        max-width: 100%;
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }
      .card-info {
        flex: 0 0 100%;
        max-width: 100%;
      }
    }

    /* Modal Overlay (Full Glowing Screen Video / Content) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 94vw;
      height: 94vh;
      background: #111018;
      background-image: radial-gradient(circle at center, #1b192c 0%, #0c0b13 100%);
      border-radius: 12px;
      overflow-y: auto;
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 60px var(--accent-glow), inset 0 0 40px rgba(0, 243, 255, 0.1);
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    .close-modal-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      color: var(--text-white);
      font-size: 2.2rem;
      cursor: pointer;
      z-index: 1010;
      line-height: 1;
      transition: color 0.2s ease;
    }
    .close-modal-btn:hover {
      color: var(--accent-cyan);
    }

    .modal-header-info {
      margin-bottom: 25px;
      padding-right: 50px;
    }

    .modal-header-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-white);
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .modal-header-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .modal-media-container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 25px;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
    }

    .modal-media-item {
      width: 100%;
      height: 100%;
      max-height: 70vh;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 30px rgba(0,0,0,0.8);
      object-fit: contain;
      background: #000;
    }

    .modal-text-view {
      width: 100%;
      max-width: 1100px;
      background: rgba(20, 19, 34, 0.6);
      border: 1px solid var(--border-color);
      padding: 25px;
      border-radius: 8px;
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--text-white);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">MY<span>ARCHIVE</span></div>
    
    <ul class="nav-tabs">
      <li>
        <button class="nav-btn active" onclick="switchSection('achievements-section', this)">Achievements</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('moments-section', this)">Moments</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('diaries-section', this)">Diaries</button>
      </li>
    </ul>
  </header>

  <main>
    <!-- ACHIEVEMENTS SECTION -->
    <section id="achievements-section" class="page-section active">
      <div id="category-filter-achievements" class="category-filter"></div>
      <div id="achievements-container">
        <div class="status-msg">Loading achievements from DB...</div>
      </div>
    </section>

    <!-- MOMENTS SECTION -->
    <section id="moments-section" class="page-section">
      <div id="category-filter-moments" class="category-filter"></div>
      <div id="moments-container">
        <div class="status-msg">Loading moments from DB...</div>
      </div>
    </section>

    <!-- DIARIES SECTION -->
    <section id="diaries-section" class="page-section">
      <div id="category-filter-diaries" class="category-filter"></div>
      <div id="diaries-container">
        <div class="status-msg">Loading diaries from DB...</div>
      </div>
    </section>
  </main>

  <!-- Glowing Modal Window -->
  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div id="modal-content" class="modal-content" onclick="event.stopPropagation()">
      <span class="close-modal-btn" onclick="closeModal()">&times;</span>
      <div id="modal-body" style="display:flex; flex-direction:column; flex:1;"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS4PJ4JdrGEdXtLeoghYJBSeScn9pH9V1l2FFCRSy8w8D4oKA1IJYZIAXT2E1_94MTG4yEUKRFdFZ-f/pub?output=csv';

    let allItems = [];
    const FALLBACK_SVG = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225"><rect width="400" height="225" fill="#141322"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#00f3ff" font-family="sans-serif" font-size="16">No Preview Available</text></svg>');

    function switchSection(sectionId, btnElement) {
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
      btnElement.classList.add('active');
    }

    async function loadContent() {
      const achContainer = document.getElementById('achievements-container');
      const momContainer = document.getElementById('moments-container');
      const diaContainer = document.getElementById('diaries-container');

      if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes('PASTE_YOUR_PUBLISHED_CSV_URL_HERE')) {
        const errMsg = `<div class="status-msg">⚠️ Please replace <b>GOOGLE_SHEET_CSV_URL</b> with your published Google Sheet CSV link.</div>`;
        achContainer.innerHTML = errMsg;
        momContainer.innerHTML = errMsg;
        diaContainer.innerHTML = errMsg;
        return;
      }

      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();
        allItems = parseCSV(csvText);

        if (allItems.length === 0) {
          const emptyMsg = `<div class="status-msg">No records found in DB.</div>`;
          achContainer.innerHTML = emptyMsg;
          momContainer.innerHTML = emptyMsg;
          diaContainer.innerHTML = emptyMsg;
          return;
        }

        renderAchievementsView('All');
        renderMomentsView('All');
        renderDiariesView('All');

      } catch (err) {
        console.error('Fetch error:', err);
        const errLoadMsg = `<div class="status-msg">Error loading content from DB.<br>Verify your sheet is Published to Web as CSV.</div>`;
        achContainer.innerHTML = errLoadMsg;
        momContainer.innerHTML = errLoadMsg;
        diaContainer.innerHTML = errLoadMsg;
      }
    }

    function parseCSV(csvText) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (inQuotes) {
          if (char === '"' && nextChar === '"') {
            currentField += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            currentField += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            currentRow.push(currentField.trim());
            currentField = '';
          } else if (char === '\r' && nextChar === '\n') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
            i++;
          } else if (char === '\n') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
          } else {
            currentField += char;
          }
        }
      }
      if (currentField !== '' || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        rows.push(currentRow);
      }

      if (rows.length < 2) return [];

      const rawHeaders = rows[0];
      const results = [];

      for (let i = 1; i < rows.length; i++) {
        const values = rows[i];
        if (!values || values.every(v => v === '')) continue;
        const row = {};

        rawHeaders.forEach((header, index) => {
          let val = values[index] ? values[index].trim() : '';
          val = val.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
          
          const cleanHeader = header.toLowerCase().replace(/[^a-z0-9]/g, '');
          
          if (['title', 'name', 'book', 'letter'].includes(cleanHeader)) row.Title = val;
          if (['videourl', 'video', 'link', 'url', 'frontcover', 'photourl', 'photo'].includes(cleanHeader)) row.VideoURL = val;
          if (['category', 'cat', 'genre', 'section'].includes(cleanHeader)) row.Category = val;
          if (['thumbnailurl', 'thumbnail', 'thumb', 'image', 'img', 'backcover'].includes(cleanHeader)) row.ThumbnailURL = val;
          if (['description', 'desc', 'author', 'summary'].includes(cleanHeader)) row.Description = val;
          if (['type'].includes(cleanHeader)) row.Type = val;
          if (['notes', 'highlights', 'quote', 'quotes', 'text'].includes(cleanHeader)) row.Notes = val;
          if (['layout', 'orientation', 'size', 'format'].includes(cleanHeader)) row.Layout = val;
        });

        if (!row.Notes && values[6]) {
          row.Notes = values[6].trim().replace(/^"|"$/g, '').replace(/""/g, '"').trim();
        }

        if (!row.Layout && values[7]) {
          row.Layout = values[7].trim().replace(/^"|"$/g, '').replace(/""/g, '"').trim();
        }

        if (row.Type && row.Type.toLowerCase() === 'private') {
          continue;
        }

        if (row.Title) {
          results.push(row);
        }
      }

      return results;
    }

    function getThumbnail(item) {
      if (item.ThumbnailURL && item.ThumbnailURL.trim() !== '') {
        const urls = getMediaURLs(item.ThumbnailURL);
        if (urls.length > 0) return urls[0];
      }
      if (item.VideoURL && item.VideoURL.trim() !== '') {
        const urls = getMediaURLs(item.VideoURL);
        if (urls.length > 0) return urls[0];
      }
      return FALLBACK_SVG;
    }

    function getMediaURLs(urlStr) {
      if (!urlStr) return [];
      return urlStr.split(';').map(u => formatCustomImageURL(u.trim())).filter(u => u !== '');
    }

    function formatCustomImageURL(url) {
      if (!url) return '';
      let clean = url.trim();
      if (clean.includes('drive.google.com')) {
        const driveId = extractGoogleDriveID(clean);
        if (driveId) {
          return `https://lh3.googleusercontent.com/d/${driveId}`;
        }
      }
      return clean;
    }

    function extractGoogleDriveID(url) {
      if (!url) return null;
      const cleanUrl = url.trim();
      const match = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return (match && match[1]) ? match[1] : null;
    }

    /* --- ACHIEVEMENTS VIEW --- */
    function renderAchievementsView(selectedCategory = 'All') {
      const filterContainer = document.getElementById('category-filter-achievements');
      const standardCategories = ['All', 'Featured', 'Work Ex', 'Education', 'Trophies', 'Projects', 'Certificates'];

      filterContainer.innerHTML = '';
      standardCategories.forEach(category => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${category.toLowerCase() === selectedCategory.toLowerCase() ? 'active' : ''}`;
        btn.textContent = category;
        btn.onclick = () => renderAchievementsView(category);
        filterContainer.appendChild(btn);
      });

      const container = document.getElementById('achievements-container');
      container.innerHTML = '';

      const sectionsConfig = [
        { key: 'featured', title: 'Featured', type: 'collage' },
        { key: 'work ex', title: 'Work Ex', type: 'scroll-row' },
        { key: 'education', title: 'Education', type: 'scroll-row' },
        { key: 'trophies', title: 'Trophies', type: 'scroll-row' },
        { key: 'projects', title: 'Projects', type: 'collage' },
        { key: 'certificates', title: 'Certificates', type: 'collage' }
      ];

      let activeSections = sectionsConfig;
      if (selectedCategory !== 'All') {
        activeSections = sectionsConfig.filter(s => s.key.toLowerCase() === selectedCategory.toLowerCase());
      }

      if (activeSections.length === 0) {
        activeSections = [{ key: selectedCategory.toLowerCase(), title: selectedCategory, type: 'scroll-row' }];
      }

      let renderedCount = 0;

      activeSections.forEach(sec => {
        const sectionItems = allItems.filter(item => {
          const cat = (item.Category || '').trim().toLowerCase();
          if (selectedCategory === 'All') {
            return cat === sec.key || (sec.key === 'featured' && (cat === 'feature' || cat === 'featured'));
          } else {
            return cat.includes(sec.key);
          }
        });

        if (selectedCategory === 'All' && sectionItems.length === 0) return;

        renderedCount++;
        const wrapper = document.createElement('div');
        wrapper.className = 'achievement-category-wrapper';

        const headerRow = document.createElement('div');
        headerRow.className = 'section-header-row';
        headerRow.innerHTML = `<h3 class="section-title">${sec.title}</h3>`;
        wrapper.appendChild(headerRow);

        const contentDiv = document.createElement('div');
        contentDiv.className = 'collage-grid';

        if (sectionItems.length === 0) {
          contentDiv.innerHTML = `<div style="color: var(--text-muted); padding: 20px;">No items in ${sec.title} yet.</div>`;
        } else {
          sectionItems.forEach(item => {
            const card = document.createElement('div');
            card.className = `card`;
            card.onclick = () => openModal(item);

            const thumb = getThumbnail(item);
            const isVideo = thumb.match(/\.(mp4|webm|ogg)$/i) || item.VideoURL?.includes('video');

            card.innerHTML = `
              <div class="collage-thumbnail-wrapper">
                ${isVideo ? `<video src="${thumb}" muted autoplay loop></video>` : `<img src="${thumb}" alt="${item.Title}" loading="lazy" onerror="this.src='${FALLBACK_SVG}'">`}
              </div>
              <div class="card-info">
                <span class="category-tag">${item.Category || sec.title}</span>
                <div class="card-title">${item.Title}</div>
                <div class="card-desc">${item.Description || ''}</div>
              </div>
            `;
            contentDiv.appendChild(card);
          });
        }

        wrapper.appendChild(contentDiv);
        container.appendChild(wrapper);
      });

      if (renderedCount === 0) {
        container.innerHTML = `<div class="status-msg">No items found for category "${selectedCategory}".</div>`;
      }
    }

    /* --- MOMENTS VIEW --- */
    function renderMomentsView(selectedCategory = 'All') {
      const momentItems = allItems.filter(item => {
        const cat = (item.Category || '').trim().toLowerCase();
        return cat.includes('moment') || cat.includes('travel') || cat.includes('memory') || cat.includes('photo');
      });

      const categories = ['All', ...new Set(momentItems.map(i => i.Category || 'Moments'))];
      const filterContainer = document.getElementById('category-filter-moments');
      filterContainer.innerHTML = '';

      categories.forEach(category => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${category.toLowerCase() === selectedCategory.toLowerCase() ? 'active' : ''}`;
        btn.textContent = category;
        btn.onclick = () => renderMomentsView(category);
        filterContainer.appendChild(btn);
      });

      const container = document.getElementById('moments-container');
      container.innerHTML = '';

      const filtered = selectedCategory === 'All' 
        ? momentItems 
        : momentItems.filter(i => (i.Category || '').trim().toLowerCase() === selectedCategory.toLowerCase());

      if (filtered.length === 0) {
        container.innerHTML = `<div class="status-msg">No moments found. Add items tagged with "Moments" or "Travel" in your sheet.</div>`;
        return;
      }

      const wrapper = document.createElement('div');
      wrapper.className = 'achievement-category-wrapper';
      wrapper.innerHTML = `
        <div class="section-header-row">
          <h3 class="section-title">Visual Memories</h3>
        </div>
      `;

      const grid = document.createElement('div');
      grid.className = 'collage-grid';

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `card`;
        card.onclick = () => openModal(item);
        const thumb = getThumbnail(item);
        const isVideo = thumb.match(/\.(mp4|webm|ogg)$/i) || item.VideoURL?.includes('video');

        card.innerHTML = `
          <div class="collage-thumbnail-wrapper">
            ${isVideo ? `<video src="${thumb}" muted autoplay loop></video>` : `<img src="${thumb}" alt="${item.Title}" loading="lazy" onerror="this.src='${FALLBACK_SVG}'">`}
          </div>
          <div class="card-info">
            <span class="category-tag">${item.Category || 'Moment'}</span>
            <div class="card-title">${item.Title}</div>
            <div class="card-desc">${item.Description || ''}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      wrapper.appendChild(grid);
      container.appendChild(wrapper);
    }

    /* --- DIARIES VIEW --- */
    function renderDiariesView(selectedCategory = 'All') {
      const diaryItems = allItems.filter(item => {
        const cat = (item.Category || '').trim().toLowerCase();
        return cat.includes('diary') || cat.includes('journal') || cat.includes('note') || cat.includes('reflection');
      });

      const categories = ['All', ...new Set(diaryItems.map(i => i.Category || 'Diaries'))];
      const filterContainer = document.getElementById('category-filter-diaries');
      filterContainer.innerHTML = '';

      categories.forEach(category => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${category.toLowerCase() === selectedCategory.toLowerCase() ? 'active' : ''}`;
        btn.textContent = category;
        btn.onclick = () => renderDiariesView(category);
        filterContainer.appendChild(btn);
      });

      const container = document.getElementById('diaries-container');
      container.innerHTML = '';

      const filtered = selectedCategory === 'All' 
        ? diaryItems 
        : diaryItems.filter(i => (i.Category || '').trim().toLowerCase() === selectedCategory.toLowerCase());

      if (filtered.length === 0) {
        container.innerHTML = `<div class="status-msg">No diary entries found. Add items tagged with "Diaries" or "Journal" in your sheet.</div>`;
        return;
      }

      const wrapper = document.createElement('div');
      wrapper.className = 'achievement-category-wrapper';
      wrapper.innerHTML = `
        <div class="section-header-row">
          <h3 class="section-title">Journal & Notes</h3>
        </div>
      `;

      const grid = document.createElement('div');
      grid.className = 'collage-grid';

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `card`;
        card.onclick = () => openModal(item);
        const thumb = getThumbnail(item);
        const isVideo = thumb.match(/\.(mp4|webm|ogg)$/i) || item.VideoURL?.includes('video');

        card.innerHTML = `
          ${thumb !== FALLBACK_SVG ? `
            <div class="collage-thumbnail-wrapper">
              ${isVideo ? `<video src="${thumb}" muted autoplay loop></video>` : `<img src="${thumb}" alt="${item.Title}" loading="lazy" onerror="this.style.display='none'">`}
            </div>
          ` : ''}
          <div class="card-info" ${thumb === FALLBACK_SVG ? 'style="max-width:100%; flex:0 0 100%;"' : ''}>
            <span class="category-tag">${item.Category || 'Diary'}</span>
            <div class="card-title">${item.Title}</div>
            <div class="card-desc">${item.Notes || item.Description || ''}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      wrapper.appendChild(grid);
      container.appendChild(wrapper);
    }

    function openModal(item) {
      const modal = document.getElementById('modal-overlay');
      const body = document.getElementById('modal-body');

      const mediaURLs = getMediaURLs(item.VideoURL);
      let mediaHTML = '';

      if (mediaURLs.length > 0) {
        mediaHTML = mediaURLs.map(url => {
          if (url.match(/\.(mp4|webm|ogg)$/i) || url.includes('video')) {
            return `<video class="modal-media-item" controls autoplay src="${url}"></video>`;
          } else {
            return `<img class="modal-media-item" src="${url}" alt="${item.Title}" loading="lazy" onerror="this.style.display='none'">`;
          }
        }).join('');
      }

      let textHTML = '';
      if (item.Notes && item.Notes.trim() !== '') {
        textHTML = `<div class="modal-text-view">${item.Notes}</div>`;
      } else if (item.Description && item.Description.trim() !== '') {
        textHTML = `<div class="modal-text-view">${item.Description}</div>`;
      }

      body.innerHTML = `
        <div class="modal-header-info">
          <span class="category-tag">${item.Category || 'Archive Item'}</span>
          <h1 class="modal-header-title">${item.Title}</h1>
          <div class="modal-header-desc">${item.Description || ''}</div>
        </div>

        <div class="modal-media-container">
          ${mediaHTML}
          ${textHTML}
        </div>
      `;

      modal.classList.add('active');
    }

    function closeModal(event) {
      if (event && event.stopPropagation) event.stopPropagation();
      const modal = document.getElementById('modal-overlay');
      const body = document.getElementById('modal-body');
      modal.classList.remove('active');
      body.innerHTML = '';
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadContent();
    });
  </script>
</body>
</html>
