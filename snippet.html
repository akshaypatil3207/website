<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Letter Sample</title>
  <style>
    body {
      background-color: #0a0a12;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .scroll-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 550px;
      padding: 20px;
    }

    /* Scroll Cylindrical Roller */
    .scroll-roller {
      width: 104%;
      height: 22px;
      background: linear-gradient(to bottom, #272545, #141322, #0a0a12);
      border: 1px solid #00f3ff;
      border-radius: 11px;
      position: relative;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
      z-index: 2;
    }

    /* Roller Knobs / Ends */
    .scroll-roller::before, .scroll-roller::after {
      content: '';
      position: absolute;
      top: -3px;
      width: 12px;
      height: 26px;
      background: #00f3ff;
      border-radius: 4px;
      box-shadow: 0 0 8px #00f3ff;
    }
    .scroll-roller::before { left: -8px; }
    .scroll-roller::after { right: -8px; }

    /* Hanging Threads & Tassels */
    .hanging-threads {
      display: flex;
      justify-content: space-around;
      width: 75%;
      height: 28px;
      position: relative;
      z-index: 1;
      margin-top: -2px;
    }

    .thread {
      width: 2px;
      height: 100%;
      background: linear-gradient(to bottom, #00f3ff, rgba(0, 243, 255, 0.1));
      position: relative;
    }

    .thread::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: -3px;
      width: 8px;
      height: 8px;
      background: #00f3ff;
      border-radius: 50%;
      box-shadow: 0 0 6px #00f3ff;
    }

    /* Unfolded Scroll Body / Text Container */
    .scroll-body {
      width: 100%;
      background: #141322;
      background-image: radial-gradient(circle at center, #1b192c 0%, #0c0b13 100%);
      border-left: 2px solid #00f3ff;
      border-right: 2px solid #00f3ff;
      padding: 40px 35px;
      box-shadow: inset 0 0 30px rgba(0, 243, 255, 0.15);
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .scroll-text {
      font-family: 'Shantell Sans', cursive, sans-serif;
      font-size: 1.35rem;
      line-height: 1.8;
      color: #ffffff;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="scroll-wrapper">
    <!-- Top Roll -->
    <div class="scroll-roller"></div>
    
    <!-- Hanging Threads Dropping Down -->
    <div class="hanging-threads">
      <div class="thread"></div>
      <div class="thread"></div>
      <div class="thread"></div>
    </div>

    <!-- Unfolded Letter Text Area -->
    <div class="scroll-body">
      <div class="scroll-text">
        Dearest Reader,

        This is a sample layout of an unrolled letter parchment. The threads hang gracefully from the top roll while the text remains visible and easy to read.

        — Your Archive
      </div>
    </div>

    <!-- Bottom Roll -->
    <div class="scroll-roller" style="margin-top: -2px;"></div>
  </div>

</body>
</html>
