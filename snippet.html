<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphic Scroll Letter Sample</title>
  <style>
    body {
      background-color: #0a0a12;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .scroll-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      filter: drop-shadow(0 0 25px rgba(0, 243, 255, 0.25));
    }

    /* SVG Roller Graphic Styling */
    .scroll-roller-graphic {
      width: 106%;
      height: 35px;
      display: block;
      z-index: 2;
    }

    /* Hanging Threads & Tassels Graphic Area */
    .threads-graphic-container {
      width: 100%;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: -10px;
      margin-bottom: -10px;
      z-index: 3;
    }

    /* Unrolled Parchment Body */
    .scroll-parchment-body {
      width: 100%;
      background: #141322;
      background-image: 
        radial-gradient(circle at center, #1e1b36 0%, #0c0b13 100%),
        repeating-linear-gradient(45deg, rgba(0, 243, 255, 0.02) 0px, rgba(0, 243, 255, 0.02) 2px, transparent 2px, transparent 4px);
      border-left: 3px solid #00f3ff;
      border-right: 3px solid #00f3ff;
      padding: 50px 40px;
      position: relative;
      z-index: 1;
      box-shadow: inset 0 0 40px rgba(0, 243, 255, 0.12);
    }

    .scroll-text-content {
      font-family: 'Shantell Sans', 'Noto Sans Devanagari', cursive, sans-serif;
      font-size: 1.4rem;
      line-height: 1.8;
      color: #ffffff;
      text-align: center;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="scroll-container">
    
    <!-- TOP GRAPHIC ROLLER WITH CYLINDER SHADING -->
    <svg class="scroll-roller-graphic" viewBox="0 0 600 35" preserveAspectRatio="none">
      <defs>
        <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1f1d36" />
          <stop offset="30%" stop-color="#00f3ff" />
          <stop offset="50%" stop-color="#080710" />
          <stop offset="70%" stop-color="#141322" />
          <stop offset="100%" stop-color="#05050a" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>
      <!-- Roller Body -->
      <rect x="15" y="5" width="570" height="25" rx="12" fill="url(#cylinderGrad)" stroke="#00f3ff" stroke-width="1.5" filter="url(#glow)" />
      <!-- Left & Right Wooden/Neon End Knobs -->
      <rect x="5" y="2" width="16" height="31" rx="6" fill="#00f3ff" filter="url(#glow)" />
      <rect x="579" y="2" width="16" height="31" rx="6" fill="#00f3ff" filter="url(#glow)" />
    </svg>

    <!-- HANGING THREADS & TASSELS GRAPHIC -->
    <div class="threads-graphic-container">
      <svg width="200" height="40" viewBox="0 0 200 40">
        <!-- Center tied string / ribbon -->
        <path d="M 60 5 Q 100 15 140 5" fill="none" stroke="#00f3ff" stroke-width="2.5" filter="url(#glow)" />
        <!-- Hanging Thread 1 -->
        <path d="M 80 10 L 80 35" fill="none" stroke="#00f3ff" stroke-width="2" />
        <circle cx="80" cy="37" r="3" fill="#00f3ff" filter="url(#glow)" />
        <!-- Hanging Thread 2 (Center Tassel) -->
        <path d="M 100 13 L 100 40" fill="none" stroke="#00f3ff" stroke-width="2.5" />
        <circle cx="100" cy="38" r="4" fill="#00f3ff" filter="url(#glow)" />
        <!-- Hanging Thread 3 -->
        <path d="M 120 10 L 120 35" fill="none" stroke="#00f3ff" stroke-width="2" />
        <circle cx="120" cy="37" r="3" fill="#00f3ff" filter="url(#glow)" />
      </svg>
    </div>

    <!-- UNROLLED PARCHMENT BODY -->
    <div class="scroll-parchment-body">
      <div class="scroll-text-content">
Dearest Reader,

This graphic scroll layout opens up between detailed cylindrical roller vectors. The hanging threads drop naturally from the top seal while your text remains fully clear and readable.

— Your Archive
      </div>
    </div>

    <!-- BOTTOM GRAPHIC ROLLER -->
    <svg class="scroll-roller-graphic" viewBox="0 0 600 35" preserveAspectRatio="none" style="margin-top: -2px;">
      <rect x="15" y="5" width="570" height="25" rx="12" fill="url(#cylinderGrad)" stroke="#00f3ff" stroke-width="1.5" filter="url(#glow)" />
      <rect x="5" y="2" width="16" height="31" rx="6" fill="#00f3ff" filter="url(#glow)" />
      <rect x="579" y="2" width="16" height="31" rx="6" fill="#00f3ff" filter="url(#glow)" />
    </svg>

  </div>

</body>
</html>
