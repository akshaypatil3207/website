<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Archive Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Shantell+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0a12;
      --card-bg: #141322;
      --card-hover: #1f1d36;
      --accent-cyan: #00f3ff;
      --accent-glow: rgba(0, 243, 255, 0.45);
      --text-white: #ffffff;
      --text-muted: #a0a0c0;
      --border-color: #272545;
      --font-notes: 'Shantell Sans', 'Noto Sans Devanagari', cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Custom Consistent Scrollbars */
    *::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    *::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    *::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: var(--accent-cyan);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(20, 19, 34, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 1px;
    }

    .brand-title span {
      color: var(--accent-cyan);
    }

    .nav-tabs {
      display: flex;
      gap: 12px;
      list-style: none;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      color: var(--accent-cyan);
    }

    .nav-btn.active {
      background: var(--card-hover);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    main {
      flex: 1;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .page-section {
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    .page-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-filter {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      min-height: 45px;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cat-btn:hover, 
    .cat-btn.active {
      background: var(--accent-cyan);
      color: #000000;
      font-weight: bold;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .achievement-category-wrapper {
      margin-bottom: 25vh;
    }

    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
    }

    .scroll-controls {
      display: flex;
      gap: 12px;
    }

    /* Enhanced, larger, bolder, glowing scroll arrows */
    .scroll-arrow-btn {
      background: var(--card-bg);
      border: 2px solid var(--accent-cyan);
      color: var(--accent-cyan);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 1;
      visibility: visible;
      font-size: 1.25rem;
      font-weight: 800;
      box-shadow: 0 0 15px var(--accent-glow), inset 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .scroll-arrow-btn.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .scroll-arrow-btn:hover {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 25px var(--accent-cyan), 0 0 40px var(--accent-glow);
      transform: scale(1.08);
    }

    .collage-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 20px;
      width: 100%;
    }

    .collage-grid .card {
      width: calc(25% - 15px);
      margin-bottom: 0;
      flex-grow: 0;
    }

    .collage-grid .card.landscape-card {
      width: calc(33.333% - 14px);
      flex-grow: 0;
    }

    .horizontal-scroll-row {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 10px;
    }

    .horizontal-scroll-row::-webkit-scrollbar {
      height: 6px;
    }

    .horizontal-scroll-row .card {
      min-width: calc(25% - 15px);
      flex: 0 0 calc(25% - 15px);
    }

    .horizontal-scroll-row .card.landscape-card {
      min-width: calc(33.333% - 14px);
      flex: 0 0 calc(33.333% - 14px);
    }

    /* ========================================================
       EXPERIMENTS SECTION STYLING & SIZING CUSTOMIZATION
       ======================================================== */
    .horizontal-scroll-row .card.experiment-card {
      min-width: calc(50% - 10px);
      flex: 0 0 calc(50% - 10px);
      cursor: default;
    }
    .horizontal-scroll-row .card.experiment-card:hover {
      transform: translateY(-4px);
    }

    .experiment-media-container {
      width: 100%;
      height: 380px; /* <-- CHANGE THIS HEIGHT VALUE TO RESIZE EXPERIMENT CARDS VERTICALLY */
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .experiment-video-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none; /* Prevents interference with hover and custom buttons */
    }

    /* Forces all embedded video iframes (YouTube & Vimeo) to fill container and center perfectly */
    .experiment-media-container iframe {
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      top: 0;
      left: 0;
      border: 0;
      pointer-events: none;
    }

    /* Top-Right Mute Button */
    .exp-mute-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 20;
      background: rgba(20, 19, 34, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }
    .exp-mute-btn:hover {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Bottom-Right Fullscreen Button */
    .exp-fs-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      z-index: 20;
      background: rgba(20, 19, 34, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }
    .exp-fs-btn:hover {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    @media (max-width: 1024px) {
      .collage-grid .card,
      .collage-grid .card.landscape-card {
        width: calc(50% - 10px);
      }
      .horizontal-scroll-row .card,
      .horizontal-scroll-row .card.landscape-card {
        min-width: calc(50% - 10px);
        flex: 0 0 calc(50% - 10px);
      }
    }

    @media (max-width: 768px) {
      .horizontal-scroll-row .card.experiment-card {
        min-width: 85%;
        flex: 0 0 85%;
      }
    }

    @media (max-width: 600px) {
      .collage-grid .card,
      .collage-grid .card.landscape-card {
        width: 85%;
      }
      .horizontal-scroll-row .card,
      .horizontal-scroll-row .card.landscape-card {
        min-width: 85%;
        flex: 0 0 85%;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    .card.diary-card .card-info {
      font-family: var(--font-notes);
    }
    .card.diary-card .card-title {
      font-family: var(--font-notes);
      font-size: 1.15rem;
    }

    .collage-thumbnail-wrapper {
      position: relative;
      width: 100%;
      background-color: #0c0b13;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .collage-thumbnail-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
    }

    .card.certificate-card .collage-thumbnail-wrapper,
    .card.extracurricular-card .collage-thumbnail-wrapper {
      height: 200px;
    }

    .card.certificate-card .collage-thumbnail-wrapper img,
    .card.extracurricular-card .collage-thumbnail-wrapper img {
      height: 100%;
      width: 100%;
      object-fit: contain;
    }

    .card:hover .collage-thumbnail-wrapper img {
      transform: scale(1.04);
    }

    .card-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .category-tag {
      align-self: flex-start;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-white);
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1.1rem;
      width: 100%;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 94vw;
      height: 94vh;
      background: #111018;
      background-image: radial-gradient(circle at center, #1b192c 0%, #0c0b13 100%);
      border-radius: 12px;
      overflow-y: auto;
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 50px var(--accent-glow), inset 0 0 40px rgba(0, 243, 255, 0.1);
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    .close-modal-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      color: var(--text-white);
      font-size: 2.2rem;
      cursor: pointer;
      z-index: 1010;
      line-height: 1;
      transition: color 0.2s ease;
    }
    .close-modal-btn:hover {
      color: var(--accent-cyan);
    }

    .modal-header-info {
      margin-bottom: 25px;
      padding-right: 50px;
    }

    .modal-header-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-white);
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .modal-header-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .modal-media-container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 25px;
      overflow-y: auto;
      align-items: center;
    }

    .modal-media-item {
      width: 100%;
      max-width: 1100px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      object-fit: contain;
      background: #000;
    }

    .modal-two-col-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }

    .modal-two-col-item {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      object-fit: cover;
      max-height: 480px;
      background: #000;
    }

    @media (max-width: 768px) {
      .modal-two-col-grid {
        grid-template-columns: 1fr;
      }
    }

    .modal-text-view {
      width: 100%;
      max-width: 1100px;
      background: rgba(20, 19, 34, 0.6);
      border: 1px solid var(--border-color);
      padding: 25px;
      border-radius: 8px;
      font-family: var(--font-notes);
      font-size: 1.15rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.9);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">MY<span>ARCHIVE</span></div>
    
    <ul class="nav-tabs">
      <li>
        <button class="nav-btn active" onclick="switchSection('achievements-section', this)">Achievements</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('moments-section', this)">Moments</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('diaries-section', this)">Diaries</button>
      </li>
    </ul>
  </header>

  <main>
    <!-- ACHIEVEMENTS SECTION -->
    <section id="achievements-section" class="page-section active">
      <div id="category-filter-achievements" class="category-filter"></div>
      <div id="achievements-container">
        <div class="status-msg">Loading achievements from DB...</div>
      </div>
    </section>

    <!-- MOMENTS SECTION -->
    <section id="moments-section" class="page-section">
      <div id="category-filter-moments" class="category-filter"></div>
      <div id="moments-container">
        <div class="status-msg">Loading moments from DB...</div>
      </div>
    </section>

    <!-- DIARIES SECTION -->
    <section id="diaries-section" class="page-section">
      <div id="category-filter-diaries" class="category-filter"></div>
      <div id="diaries-container">
        <div class="status-msg">Loading diaries from DB...</div>
      </div>
    </section>
  </main>

  <!-- Glowing Modal Window -->
  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div id="modal-content" class="modal-content" onclick="event.stopPropagation()">
      <span class="close-modal-btn" onclick="closeModal()">&times;</span>
      <div id="modal-body" style="display:flex; flex-direction:column; flex:1;"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS4PJ4JdrGEdXtLeoghYJBSeScn9pH9V1l2FFCRSy8w8D4oKA1IJYZIAXT2E1_94MTG4yEUKRFdFZ-f/pub?output=csv';

    let allItems = [];
    let videoPlayers = {}; // Stores YouTube and Vimeo player instances for experiment cards
    const FALLBACK_SVG = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225"><rect width="400" height="225" fill="#141322"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#00f3ff" font-family="sans-serif" font-size="16">No Preview Available</text></svg>');

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // Load Vimeo Player API script
    const vimeoScript = document.createElement('script');
    vimeoScript.src = "https://player.vimeo.com/api/player.js";
    document.head.appendChild(vimeoScript);

    window.onYouTubeIframeAPIReady = function() {
      initAllVideoPlayers();
    };

    function initAllVideoPlayers() {
      document.querySelectorAll('.experiment-video-iframe').forEach((el) => {
        const playerId = el.id;
        if (!playerId || videoPlayers[playerId]) return;
        
        const videoUrl = el.dataset.videoUrl;
        const videoType = el.dataset.videoType;

        if (videoType === 'youtube') {
          const ytId = extractYouTubeID(videoUrl);
          if (!ytId) return;

          try {
            videoPlayers[playerId] = new YT.Player(playerId, {
              videoId: ytId,
              playerVars: {
                'autoplay': 0,
                'controls': 0,
                'disablekb': 1,
                'fs': 0,
                'playsinline': 1,
                'rel': 0,
                'vq': 'hd1080'
              },
              events: {
                'onReady': (event) => {
                  try {
                    event.target.mute(); // Start muted for hover playback
                    event.target.setPlaybackQuality('hd1080');
                  } catch (e) {
                    console.log('Player ready error:', e);
                  }
                }
              }
            });
          } catch (err) {
            console.log('YT init error:', err);
          }
        } else if (videoType === 'vimeo') {
          const vimeoId = extractVimeoID(videoUrl);
          if (!vimeoId) return;

          try {
            if (typeof Vimeo !== 'undefined' && Vimeo.Player) {
              const vimeoPlayer = new Vimeo.Player(playerId, {
                id: parseInt(vimeoId, 10),
                autoplay: false,
                controls: false,
                muted: true,
                loop: true,
                transparent: false
              });
              videoPlayers[playerId] = vimeoPlayer;
              vimeoPlayer.setMuted(true);
            } else {
              // Retry shortly if Vimeo script is still loading
              setTimeout(initAllVideoPlayers, 200);
            }
          } catch (err) {
            console.log('Vimeo init error:', err);
          }
        }
      });
    }

    // Hover playback controls for experiments
    function playExpVideo(playerId, videoType) {
      const player = videoPlayers[playerId];
      if (!player) return;
      try {
        if (videoType === 'youtube' && typeof player.playVideo === 'function') {
          player.playVideo();
        } else if (videoType === 'vimeo' && typeof player.play === 'function') {
          player.play();
        }
      } catch (e) {
        console.log('Play error:', e);
      }
    }

    function pauseExpVideo(playerId, videoType) {
      const player = videoPlayers[playerId];
      if (!player) return;
      try {
        if (videoType === 'youtube' && typeof player.pauseVideo === 'function') {
          player.pauseVideo();
        } else if (videoType === 'vimeo' && typeof player.pause === 'function') {
          player.pause();
        }
      } catch (e) {
        console.log('Pause error:', e);
      }
    }

    // Mute / Unmute toggle for experiment top-right button
    function toggleExpMute(playerId, videoType, btnElement) {
      const player = videoPlayers[playerId];
      if (!player) return;
      try {
        if (videoType === 'youtube' && typeof player.isMuted === 'function') {
          if (player.isMuted()) {
            player.unMute();
            player.setVolume(100);
            btnElement.textContent = '🔊';
            btnElement.title = 'Mute';
          } else {
            player.mute();
            btnElement.textContent = '🔇';
            btnElement.title = 'Unmute';
          }
        } else if (videoType === 'vimeo' && typeof player.getMuted === 'function') {
          player.getMuted().then(muted => {
            if (muted) {
              player.setMuted(false);
              player.setVolume(1);
              btnElement.textContent = '🔊';
              btnElement.title = 'Mute';
            } else {
              player.setMuted(true);
              btnElement.textContent = '🔇';
              btnElement.title = 'Unmute';
            }
          });
        }
      } catch (e) {
        console.log('Mute toggle error:', e);
      }
    }

    // Fullscreen toggle for experiment bottom-right button (automatically unmutes audio upon fullscreen)
    function toggleExpFullscreen(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;

      if (!document.fullscreenElement) {
        // Automatically turn on audio when entering fullscreen
        const playerId = containerId.replace('container-', '');
        const player = videoPlayers[playerId];
        const iframeEl = container.querySelector('.experiment-video-iframe');
        const videoType = iframeEl ? iframeEl.dataset.videoType : 'youtube';
        const muteBtn = container.querySelector('.exp-mute-btn');

        if (player) {
          try {
            if (videoType === 'youtube' && typeof player.unMute === 'function') {
              player.unMute();
              player.setVolume(100);
            } else if (videoType === 'vimeo' && typeof player.setMuted === 'function') {
              player.setMuted(false);
              player.setVolume(1);
            }
            if (muteBtn) {

    function parseCSV(csvText) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (inQuotes) {
          if (char === '"' && nextChar === '"') {
            currentField += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            currentField += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            currentRow.push(currentField.trim());
            currentField = '';
          } else if (char === '\r' && nextChar === '\n') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
            i++;
          } else if (char === '\n') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
          } else {
            currentField += char;
          }
        }
      }
      if (currentField !== '' || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        rows.push(currentRow);
      }

      if (rows.length < 2) return [];

      const rawHeaders = rows[0];
      const results = [];

      for (let i = 1; i < rows.length; i++) {
        const values = rows[i];
        if (!values || values.every(v => v === '')) continue;
        const row = {};

        rawHeaders.forEach((header, index) => {
          let val = values[index] ? values[index].trim() : '';
          val = val.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
          
          const cleanHeader = header.toLowerCase().replace(/[^a-z0-9]/g, '');
          
          if (['title', 'name', 'book', 'letter'].includes(cleanHeader)) row.Title = val;
          if (['videourl', 'video', 'link', 'url', 'frontcover', 'photourl', 'photo'].includes(cleanHeader)) row.VideoURL = val;
          if (['category', 'cat', 'genre', 'section'].includes(cleanHeader)) row.Category = val;
          if (['thumbnailurl', 'thumbnail', 'thumb', 'image', 'img', 'backcover'].includes(cleanHeader)) row.ThumbnailURL = val;
          if (['description', 'desc', 'author', 'summary'].includes(cleanHeader)) row.Description = val;
          if (['type'].includes(cleanHeader)) row.Type = val;
          if (['notes', 'highlights', 'quote', 'quotes', 'text'].includes(cleanHeader)) row.Notes = val;
          if (['layout', 'orientation', 'size', 'format'].includes(cleanHeader)) row.Layout = val;
        });

        if (!row.Notes && values[6]) {
          row.Notes = values[6].trim().replace(/^"|"$/g, '').replace(/""/g, '"').trim();
        }

        if (!row.Layout && values[7]) {
          row.Layout = values[7].trim().replace(/^"|"$/g, '').replace(/""/g, '"').trim();
        }

        if (row.Type && row.Type.toLowerCase() === 'private') {
          continue;
        }

        if (row.Title) {
          results.push(row);
        }
      }

      return results;
    }

    function extractYouTubeID(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2] && match[2].length >= 10) ? match[2].split('?')[0].split('&')[0] : null;
    }

    function extractVimeoID(url) {
      if (!url) return null;
      const match = url.match(/vimeo\.com\/(?:video\/|channels\/[\w^\/]+\/|groups\/[\w^\/]+\/videos\/|)(\d+)/) || url.match(/^(\d+)$/);
      return match ? match[1] : null;
    }

    function getThumbnail(item) {
      if (item.ThumbnailURL && item.ThumbnailURL.trim() !== '') {
        const urls = getMediaURLs(item.ThumbnailURL);
        if (urls.length > 0) return urls[0];
      }
      if (item.VideoURL && item.VideoURL.trim() !== '') {
        const ytId = extractYouTubeID(item.VideoURL);
        if (ytId) {
          return `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
        }
        const urls = getMediaURLs(item.VideoURL);
        if (urls.length > 0) return urls[0];
      }
      return FALLBACK_SVG;
    }

    function getMediaURLs(urlStr) {
      if (!urlStr) return [];
      return urlStr.split(';').map(u => formatCustomImageURL(u.trim())).filter(u => u !== '');
    }

    function formatCustomImageURL(url) {
      if (!url) return '';
      let clean = url.trim();
      if (clean.includes('drive.google.com')) {
        const driveId = extractGoogleDriveID(clean);
        if (driveId) {
          return `https://lh3.googleusercontent.com/d/${driveId}`;
        }
      }
      return clean;
    }

    function extractGoogleDriveID(url) {
      if (!url) return null;
      const cleanUrl = url.trim();
      const match = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return (match && match[1]) ? match[1] : null;
    }

    // Precise 1-click scroll by exactly one card width + gap to reach the next video/card
    function scrollRowByCard(rowId, direction) {
      const row = document.getElementById(rowId);
      if (!row) return;
      const card = row.querySelector('.card');
      if (!card) {
        row.scrollBy({ left: direction * 350, behavior: 'smooth' });
        return;
      }
      const cardWidth = card.offsetWidth;
      const gap = 20; // Matches CSS gap
      const scrollDistance = (cardWidth + gap) * direction;
      row.scrollBy({ left: scrollDistance, behavior: 'smooth' });
    }

    function updateScrollArrows(rowId) {
      const row = document.getElementById(rowId);
      const leftBtn = document.getElementById(`${rowId}-left-btn`);
      const rightBtn = document.getElementById(`${rowId}-right-btn`);

      if (!row || !leftBtn || !rightBtn) return;

      const scrollLeft = row.scrollLeft;
      const maxScrollLeft = row.scrollWidth - row.clientWidth;

      if (scrollLeft > 5) {
        leftBtn.classList.remove('hidden');
      } else {
        leftBtn.classList.add('hidden');
      }

      if (maxScrollLeft - scrollLeft > 5) {
        rightBtn.classList.remove('hidden');
      } else {
        rightBtn.classList.add('hidden');
      }
    }

      // Reset media container scroll position as well
      const mediaContainer = body.querySelector('.modal-media-container');
      if (mediaContainer) {
        mediaContainer.scrollTop = 0;
      }
      
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';

      setTimeout(initAllVideoPlayers, 150);
    }

    function closeModal(event) {
      if (!event || event.target.id === 'modal-overlay' || event.target.classList.contains('close-modal-btn')) {
        const modal = document.getElementById('modal-overlay');
        modal.classList.remove('active');
        document.body.style.overflow = '';
        document.getElementById('modal-body').innerHTML = '';
      }
    }

    window.addEventListener('resize', () => {
      document.querySelectorAll('.horizontal-scroll-row').forEach(row => {
        updateScrollArrows(row.id);
      });
    });

    window.addEventListener('DOMContentLoaded', loadContent);
  </script>
</body>
</html>
