<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Letters Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Shantell+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <!-- PDF.js Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <style>
    :root {
      --bg-main: #0a0a12;
      --card-bg: #141322;
      --card-hover: #1f1d36;
      --accent-cyan: #00f3ff;
      --accent-glow: rgba(0, 243, 255, 0.35);
      --text-white: #ffffff;
      --text-muted: #a0a0c0;
      --border-color: #272545;
      --font-notes: 'Shantell Sans', 'Noto Sans Devanagari', cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(20, 19, 34, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 1px;
    }

    .brand-title span {
      color: var(--accent-cyan);
    }

    main {
      flex: 1;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .category-filter {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      min-height: 45px;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cat-btn:hover, 
    .cat-btn.active {
      background: var(--accent-cyan);
      color: #000000;
      font-weight: bold;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    .book-thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 150%;
      background-color: #000000;
    }

    .book-thumbnail-wrapper img,
    .book-thumbnail-wrapper canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .category-tag {
      align-self: flex-start;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-white);
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 95vw;
      max-width: 1400px;
      height: 92vh;
      background: var(--card-bg);
      border-radius: 12px;
      overflow-y: auto;
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 0 35px var(--accent-glow);
      padding: 40px;
    }

    .letter-modal-content {
      background: #111018;
      background-image: radial-gradient(circle at center, #1b192c 0%, #0c0b13 100%);
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 45px var(--accent-glow), inset 0 0 35px rgba(0, 243, 255, 0.1);
    }

    .letter-header-info {
      margin-bottom: 25px;
    }

    .letter-header-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-white);
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .letter-header-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .letter-display-box {
      margin-top: 25px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .letter-pdf-view {
      width: 100%;
      max-width: 900px;
      background: #000;
    }

    .letter-text-view {
      width: 100%;
      background: transparent;
      padding: 10px 0;
      font-family: var(--font-notes);
      font-size: 1.4rem;
      line-height: 1.7;
      color: var(--text-white);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .close-modal-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      color: var(--text-white);
      font-size: 2.2rem;
      cursor: pointer;
      z-index: 1010;
      line-height: 1;
      transition: color 0.2s ease;
    }
    .close-modal-btn:hover {
      color: var(--accent-cyan);
    }

    .notes-heading {
      color: var(--accent-cyan);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 35px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }
    .notes-heading-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .notes-toggle-group {
      display: flex;
      gap: 10px;
    }
    .notes-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .notes-toggle-btn:hover,
    .notes-toggle-btn.active {
      background: var(--accent-cyan);
      color: #000000;
      font-weight: bold;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">MY<span>LETTERS</span></div>
  </header>

  <main>
    <section id="letters-section" class="page-section active">
      <div id="category-filter-letters" class="category-filter"></div>
      <div id="letters-grid" class="grid-container">
        <div class="status-msg">Loading letters from DB...</div>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div id="modal-content" class="modal-content letter-modal-content" onclick="event.stopPropagation()">
      <span class="close-modal-btn" onclick="closeModal()">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9maPUHMbAkZTS4c72grAzJvX3pCMQCIfSPXzb7lRH2vEILq4OuoAsF1zPtFEMHkleJkqRr0iZLfvy/pub?output=csv';

    let allItems = [];
    let currentLetterModalData = null;

    const FALLBACK_SVG = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225"><rect width="400" height="225" fill="#141322"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#00f3ff" font-family="sans-serif" font-size="16">No Preview Available</text></svg>');

    async function loadContent() {
      const lettersGrid = document.getElementById('letters-grid');

      if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes('PASTE_YOUR_PUBLISHED_CSV_URL_HERE')) {
        lettersGrid.innerHTML = `<div class="status-msg">⚠️ Please replace <b>GOOGLE_SHEET_CSV_URL</b> with your published Google Sheet CSV link.</div>`;
        return;
      }

      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();
        allItems = parseCSV(csvText);

        if (allItems.length === 0) {
          lettersGrid.innerHTML = `<div class="status-msg">No letters found in DB.</div>`;
          return;
        }

        renderLettersSection();

      } catch (err) {
        console.error('Fetch error:', err);
        lettersGrid.innerHTML = `<div class="status-msg">Error loading content from DB.<br>Verify your sheet is Published to Web as CSV.</div>`;
      }
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/);
      if (lines.length < 2) return [];

      const rawHeaders = parseCSVLine(lines[0]);
      const results = [];

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);
        const row = {};

        rawHeaders.forEach((header, index) => {
          let val = values[index] ? values[index].trim() : '';
          val = val.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
          
          const cleanHeader = header.toLowerCase().replace(/[^a-z0-9]/g, '');
          
          if (['title', 'name', 'book', 'letter'].includes(cleanHeader)) row.Title = val;
          if (['videourl', 'video', 'link', 'url', 'frontcover', 'photourl', 'photo'].includes(cleanHeader)) row.VideoURL = val;
          if (['category', 'cat', 'genre'].includes(cleanHeader)) row.Category = val;
          if (['thumbnailurl', 'thumbnail', 'thumb', 'image', 'img', 'backcover'].includes(cleanHeader)) row.ThumbnailURL = val;
          if (['description', 'desc', 'author', 'summary'].includes(cleanHeader)) row.Description = val;
          if (['type'].includes(cleanHeader)) row.Type = val;
          if (['notes', 'highlights', 'quote', 'quotes', 'text'].includes(cleanHeader)) row.Notes = val;
        });

        if (!row.Notes && values[6]) {
          row.Notes = values[6].trim().replace(/^"|"$/g, '').replace(/""/g, '"').trim();
        }

        if (row.Type && row.Type.toLowerCase() === 'private') {
          continue;
        }

        if (row.Title && (row.VideoURL || row.ThumbnailURL)) {
          results.push(row);
        }
      }

      return results;
    }

    function parseCSVLine(text) {
      const result = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cur);
          cur = '';
        } else {
          cur += c;
        }
      }
      result.push(cur);
      return result;
    }

    function renderLettersSection(selectedCategory = 'All') {
      const sectionItems = allItems.filter(item => {
        const t = (item.Type || '').toLowerCase().trim();
        return t === 'letters' || t === 'letter';
      });

      const filterContainer = document.getElementById('category-filter-letters');
      const uniqueCategories = [
        'All',
        ...new Set(
          sectionItems
            .map(item => item.Category ? item.Category.trim() : '')
            .filter(cat => cat !== '')
        )
      ];

      filterContainer.innerHTML = '';
      uniqueCategories.forEach(category => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${category.toLowerCase() === selectedCategory.toLowerCase() ? 'active' : ''}`;
        btn.textContent = category;
        btn.onclick = () => renderLettersSection(category);
        filterContainer.appendChild(btn);
      });

      let finalItems = sectionItems;
      if (selectedCategory !== 'All') {
        finalItems = sectionItems.filter(v => 
          v.Category && v.Category.trim().toLowerCase() === selectedCategory.toLowerCase()
        );
      }

      const grid = document.getElementById('letters-grid');
      grid.innerHTML = '';

      if (finalItems.length === 0) {
        grid.innerHTML = `<div class="status-msg">No letters found in this category.</div>`;
        return;
      }

      finalItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        card.onclick = () => openLetterModal(item);

        card.innerHTML = `
          <div class="book-thumbnail-wrapper">
            <img class="card-thumb-img" src="${FALLBACK_SVG}" alt="${item.Title}" loading="lazy">
          </div>
          <div class="card-info">
            <span class="category-tag">${item.Category || 'Letter'}</span>
            <div class="card-title">${item.Title}</div>
            <div class="card-desc">${item.Description || ''}</div>
          </div>
        `;

        grid.appendChild(card);

        // Render first page of PDF as thumbnail asynchronously
        const pdfUrl = formatPDFUrl(item.VideoURL || item.ThumbnailURL);
        const imgElement = card.querySelector('.card-thumb-img');
        if (pdfUrl) {
          renderPDFThumbnail(pdfUrl, imgElement);
        }
      });
    }

    function formatPDFUrl(url) {
      if (!url) return '';
      let clean = url.trim();
      if (clean.includes('drive.google.com')) {
        const driveId = extractGoogleDriveID(clean);
        if (driveId) {
          return `https://drive.google.com/uc?export=download&id=${driveId}`;
        }
      }
      return clean;
    }

    async function renderPDFThumbnail(url, imgElement) {
      try {
        const loadingTask = pdfjsLib.getDocument(url);
        const pdfDoc = await loadingTask.promise;
        const page = await pdfDoc.getPage(1);
        const viewport = page.getViewport({ scale: 1.0 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const context = canvas.getContext('2d');
        await page.render({ canvasContext: context, viewport: viewport }).promise;
        imgElement.src = canvas.toDataURL();
      } catch (err) {
        console.error('PDF thumbnail render error:', err);
      }
    }

    function extractGoogleDriveID(url) {
      if (!url) return null;
      const cleanUrl = url.trim();
      const match = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return (match && match[1]) ? match[1] : null;
    }

    function openLetterModal(letter) {
      currentLetterModalData = letter;
      const modal = document.getElementById('modal-overlay');
      const body = document.getElementById('modal-body');

      body.innerHTML = `
        <div style="position: relative;">
          <div class="letter-header-info">
            <span class="category-tag">${letter.Category || 'Letter'}</span>
            <h1 class="letter-header-title">${letter.Title}</h1>
            <div class="letter-header-desc">${letter.Description || ''}</div>
          </div>

          <div class="notes-heading">
            <div class="notes-heading-title">
              <span>✉️</span> Letter Archive
            </div>
            <div class="notes-toggle-group">
              <button id="btn-letter-pdf" class="notes-toggle-btn active" onclick="switchLetterTab('pdf')">PDF</button>
              <button id="btn-letter-text" class="notes-toggle-btn" onclick="switchLetterTab('text')">Text</button>
            </div>
          </div>

          <div id="letter-display-container" class="letter-display-box">
            <div id="pdf-container" class="letter-pdf-view">
              <div style="text-align:center; padding: 40px; color: var(--text-muted);">Loading PDF pages...</div>
            </div>
          </div>
        </div>
      `;

      modal.classList.add('active');

      const pdfUrl = formatPDFUrl(letter.VideoURL || letter.ThumbnailURL);
      if (pdfUrl) {
        renderPDFInContainer(pdfUrl, document.getElementById('pdf-container'));
      } else {
        document.getElementById('pdf-container').innerHTML = `<div class="status-msg">No PDF link provided.</div>`;
      }
    }

    async function renderPDFInContainer(url, container) {
      try {
        const loadingTask = pdfjsLib.getDocument(url);
        const pdfDoc = await loadingTask.promise;
        container.innerHTML = '';

        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const page = await pdfDoc.getPage(i);
          const viewport = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-page-canvas';
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          canvas.style.width = '100%';
          canvas.style.height = 'auto';
          canvas.style.marginBottom = '20px';
          canvas.style.display = 'block';
          canvas.style.borderRadius = '4px';
          canvas.style.boxShadow = '0 6px 20px rgba(0,0,0,0.6)';

          container.appendChild(canvas);
          await page.render({ canvasContext: context, viewport: viewport }).promise;
        }
      } catch (err) {
        console.error('PDF full render error:', err);
        container.innerHTML = `<div class="status-msg">Error loading PDF document. Please verify the shared link permissions.</div>`;
      }
    }

    function switchLetterTab(mode) {
      if (!currentLetterModalData) return;

      const pdfBtn = document.getElementById('btn-letter-pdf');
      const textBtn = document.getElementById('btn-letter-text');
      const container = document.getElementById('letter-display-container');

      if (!container) return;

      const letterText = currentLetterModalData.Notes || 'No text content provided.';

      if (mode === 'pdf') {
        pdfBtn.classList.add('active');
        textBtn.classList.remove('active');
        container.innerHTML = `
          <div id="pdf-container" class="letter-pdf-view">
            <div style="text-align:center; padding: 40px; color: var(--text-muted);">Loading PDF pages...</div>
          </div>
        `;
        const pdfUrl = formatPDFUrl(currentLetterModalData.VideoURL || currentLetterModalData.ThumbnailURL);
        if (pdfUrl) {
          renderPDFInContainer(pdfUrl, document.getElementById('pdf-container'));
        }
      } else {
        textBtn.classList.add('active');
        pdfBtn.classList.remove('active');
        container.innerHTML = `
          <div class="letter-text-view">${letterText}</div>
        `;
      }
    }

    function closeModal(event) {
      if (event && event.stopPropagation) event.stopPropagation();
      const modal = document.getElementById('modal-overlay');
      const body = document.getElementById('modal-body');

      modal.classList.remove('active');
      body.innerHTML = '';
      currentLetterModalData = null;
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadContent();
    });
  </script>
</body>
</html>
