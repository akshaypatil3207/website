<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Archive Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Shantell+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0a12;
      --card-bg: #141322;
      --card-hover: #1f1d36;
      --accent-cyan: #00f3ff;
      --accent-glow: rgba(0, 243, 255, 0.35);
      --text-white: #ffffff;
      --text-muted: #a0a0c0;
      --border-color: #272545;
      --font-notes: 'Shantell Sans', 'Noto Sans Devanagari', cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(20, 19, 34, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 1px;
    }

    .brand-title span {
      color: var(--accent-cyan);
    }

    .nav-tabs {
      display: flex;
      gap: 12px;
      list-style: none;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      color: var(--accent-cyan);
    }

    .nav-btn.active {
      background: var(--card-hover);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    main {
      flex: 1;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .page-section {
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    .page-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-filter {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      min-height: 45px;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cat-btn:hover, 
    .cat-btn.active {
      background: var(--accent-cyan);
      color: #000000;
      font-weight: bold;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    .book-thumbnail-wrapper {
      position: relative;
      width: 100%;
      padding-top: 150%;
      background-color: #000000;
    }

    .book-thumbnail-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .category-tag {
      align-self: flex-start;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-white);
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 98vw;
      max-width: 1500px;
      height: 95vh;
      background: var(--card-bg);
      border-radius: 12px;
      overflow-y: auto;
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 0 35px var(--accent-glow);
      padding: 30px;
      display: flex;
      flex-direction: column;
    }

    .letter-modal-content {
      background: #111018;
      background-image: radial-gradient(circle at center, #1b192c 0%, #0c0b13 100%);
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 45px var(--accent-glow), inset 0 0 35px rgba(0, 243, 255, 0.1);
    }

    .modal-top-controls {
      position: absolute;
      top: 65px;
      right: 30px;
      z-index: 10;
    }

    .letter-header-info {
      margin-bottom: 20px;
      padding-right: 180px;
    }

    .letter-header-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-white);
      margin-top: 4px;
      margin-bottom: 6px;
    }

    .letter-header-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .letter-display-box {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .letter-photos-view {
      width: 100%;
      flex: 1;
      min-height: 75vh;
      background: #000;
      border-radius: 8px;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .letter-photos-view img {
      width: 100%;
      max-width: 950px;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .letter-text-view {
      width: 100%;
      background: transparent;
      padding: 10px 0;
      font-family: var(--font-notes);
      font-size: 1.4rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.85);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .close-modal-btn {
      position: absolute;
      top: 15px;
      right: 25px;
      color: var(--text-white);
      font-size: 2.2rem;
      cursor: pointer;
      z-index: 1010;
      line-height: 1;
      transition: color 0.2s ease;
    }
    .close-modal-btn:hover {
      color: var(--accent-cyan);
    }

    .notes-toggle-group {
      display: flex;
      gap: 10px;
    }
    .notes-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .notes-toggle-btn:hover,
    .notes-toggle-btn.active {
      background: var(--accent-cyan);
      color: #000000;
      font-weight: bold;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-glow);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">MY<span>ARCHIVE</span></div>
    
    <ul class="nav-tabs">
      <li>
        <button class="nav-btn active" onclick="switchSection('letters-section', this)">Letters</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('achievements-section', this)">Achievements</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('moments-section', this)">Moments</button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchSection('diaries-section', this)">Diaries</button>
      </li>
    </ul>
  </header>

  <main>
    <!-- LETTERS SECTION -->
    <section id="letters-section" class="page-section active">
      <div id="category-filter-letters" class="category-filter"></div>
      <div id="letters-grid" class="grid-container">
        <div class="status-msg">Loading letters from DB...</div>
      </div>
    </section>

    <!-- ACHIEVEMENTS SECTION -->
    <section id="achievements-section" class="page-section">
      <h2 style="color: var(--accent-cyan); margin-bottom: 10px;">Achievements</h2>
      <p style="color: var(--text-muted);">This section will be populated with your achievements.</p>
    </section>

    <!-- MOMENTS SECTION -->
    <section id="moments-section" class="page-section">
      <h2 style="color: var(--accent-cyan); margin-bottom: 10px;">Moments</h2>
      <p style="color: var(--text-muted);">This section will be populated with your special moments.</p>
    </section>

    <!-- DIARIES SECTION -->
    <section id="diaries-section" class="page-section">
      <h2 style="color: var(--accent-cyan); margin-bottom: 10px;">Diaries</h2>
      <p style="color: var(--text-muted);">This section will be populated with your diary entries.</p>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div id="modal-content" class="modal-content letter-modal-content" onclick="event.stopPropagation()">
      <span class="close-modal-btn" onclick="closeModal()">&times;</span>
      
      <div class="modal-top-controls">
        <div class="notes-toggle-group">
          <button id="btn-letter-text" class="notes-toggle-btn active" onclick="switchLetterTab('text')">Text</button>
          <button id="btn-letter-photos" class="notes-toggle-btn" onclick="switchLetterTab('photos')">Photos</button>
        </div>
      </div>

      <div id="modal-body" style="display:flex; flex-direction:column; flex:1;"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlRmBiNy0oFDzcDat0wJaXbnj6r2hnNCB0WHQWtVQamALju66NwkR4Q6lB7_tTi4PhaCtmnjFwXH6N/pub?output=csv';

    let allItems = [];
    let currentLetterModalData = null;

    const FALLBACK_SVG = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225"><rect width="400" height="225" fill="#141322"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#00f3ff" font-family="sans-serif" font-size="16">No Preview Available</text></svg>');

    function switchSection(sectionId, btnElement) {
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
      btnElement.classList.add('active');
    }

    async function loadContent() {
      const lettersGrid = document.getElementById('letters-grid');

      if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes('PASTE_YOUR_PUBLISHED_CSV_URL_HERE')) {
        lettersGrid.innerHTML = `<div class="status-msg">⚠️ Please replace <b>GOOGLE_SHEET_CSV_URL</b> with your published Google Sheet CSV link.</div>`;
        return;
      }

      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();
        allItems = parseCSV(csvText);

        if (allItems.length === 0) {
          lettersGrid.innerHTML = `<div class="status-msg">No letters found in DB.</div>`;
          return;
        }

        renderLettersSection();

      } catch (err) {
        console.error('Fetch error:', err);
        lettersGrid.innerHTML = `<div class="status-msg">Error loading content from DB.<br>Verify your sheet is Published to Web as CSV.</div>`;
      }
    }

    function parseCSV(csvText) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (inQuotes) {
          if (char === '"' && nextChar === '"') {
            currentField += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            currentField += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            currentRow.push(currentField.trim());
            currentField = '';
          } else if (char === '\r' && nextChar === '\n') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
            i++;
          } else if (char === '\n') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
          } else {
            currentField += char;
          }
        }
      }
      if (currentField !== '' || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        rows.push(currentRow);
      }

      if (rows.length < 2) return [];

      const rawHeaders = rows[0];
      const results = [];

      for (let i = 1; i < rows.length; i++) {
        const values = rows[i];
        if (!values || values.every(v => v === '')) continue;
        const row = {};

        rawHeaders.forEach((header, index) => {
          let val = values[index] ? values[index].trim() : '';
          val = val.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
          
          const cleanHeader = header.toLowerCase().replace(/[^a-z0-9]/g, '');
          
          if (['title', 'name', 'book', 'letter'].includes(cleanHeader)) row.Title = val;
          if (['videourl', 'video', 'link', 'url', 'frontcover', 'photourl', 'photo'].includes(cleanHeader)) row.VideoURL = val;
          if (['category', 'cat', 'genre'].includes(cleanHeader)) row.Category = val;
          if (['thumbnailurl', 'thumbnail', 'thumb', 'image', 'img', 'backcover'].includes(cleanHeader)) row.ThumbnailURL = val;
          if (['description', 'desc', 'author', 'summary'].includes(cleanHeader)) row.Description = val;
          if (['type'].includes(cleanHeader)) row.Type = val;
          if (['notes', 'highlights', 'quote', 'quotes', 'text'].includes(cleanHeader)) row.Notes = val;
        });

        if (!row.Notes && values[6]) {
          row.Notes = values[6].trim().replace(/^"|"$/g, '').replace(/""/g, '"').trim();
        }

        if (row.Type && row.Type.toLowerCase() === 'private') {
          continue;
        }

        if (row.Title && (row.VideoURL || row.ThumbnailURL || row.Notes)) {
          results.push(row);
        }
      }

      return results;
    }

    function renderLettersSection(selectedCategory = 'All') {
      const sectionItems = allItems.filter(item => {
        const t = (item.Type || '').toLowerCase().trim();
        return t === 'letters' || t === 'letter' || t === '';
      });

      const filterContainer = document.getElementById('category-filter-letters');
      const uniqueCategories = [
        'All',
        ...new Set(
          sectionItems
            .map(item => item.Category ? item.Category.trim() : '')
            .filter(cat => cat !== '')
        )
      ];

      filterContainer.innerHTML = '';
      uniqueCategories.forEach(category => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${category.toLowerCase() === selectedCategory.toLowerCase() ? 'active' : ''}`;
        btn.textContent = category;
        btn.onclick = () => renderLettersSection(category);
        filterContainer.appendChild(btn);
      });

      let finalItems = sectionItems;
      if (selectedCategory !== 'All') {
        finalItems = sectionItems.filter(v => 
          v.Category && v.Category.trim().toLowerCase() === selectedCategory.toLowerCase()
        );
      }

      const grid = document.getElementById('letters-grid');
      grid.innerHTML = '';

      if (finalItems.length === 0) {
        grid.innerHTML = `<div class="status-msg">No letters found in this category.</div>`;
        return;
      }

      finalItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        card.onclick = () => openLetterModal(item);

        const urls = getImageURLs(item.VideoURL || item.ThumbnailURL);
        const coverImg = urls.length > 0 ? urls[0] : FALLBACK_SVG;

        card.innerHTML = `
          <div class="book-thumbnail-wrapper">
            <img class="card-thumb-img" src="${coverImg}" alt="${item.Title}" loading="lazy" onerror="this.src='${FALLBACK_SVG}'">
          </div>
          <div class="card-info">
            <span class="category-tag">${item.Category || 'Letter'}</span>
            <div class="card-title">${item.Title}</div>
            <div class="card-desc">${item.Description || ''}</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function getImageURLs(urlStr) {
      if (!urlStr) return [];
      return urlStr.split(';').map(u => formatCustomImageURL(u.trim())).filter(u => u !== '');
    }

    function formatCustomImageURL(url) {
      if (!url) return '';
      let clean = url.trim();
      if (clean.includes('drive.google.com')) {
        const driveId = extractGoogleDriveID(clean);
        if (driveId) {
          return `https://lh3.googleusercontent.com/d/${driveId}`;
        }
      }
      return clean;
    }

    function extractGoogleDriveID(url) {
      if (!url) return null;
      const cleanUrl = url.trim();
      const match = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || 
                    cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return (match && match[1]) ? match[1] : null;
    }

    function openLetterModal(letter) {
      currentLetterModalData = letter;
      const modal = document.getElementById('modal-overlay');
      const body = document.getElementById('modal-body');

      const textBtn = document.getElementById('btn-letter-text');
      const photosBtn = document.getElementById('btn-letter-photos');
      if (textBtn && photosBtn) {
        textBtn.classList.add('active');
        photosBtn.classList.remove('active');
      }

      const letterText = letter.Notes || 'No text content provided.';

      body.innerHTML = `
        <div class="letter-header-info">
          <span class="category-tag">${letter.Category || 'Letter'}</span>
          <h1 class="letter-header-title">${letter.Title}</h1>
          <div class="letter-header-desc">${letter.Description || ''}</div>
        </div>

        <div id="letter-display-container" class="letter-display-box">
          <div class="letter-text-view">${letterText}</div>
        </div>
      `;

      modal.classList.add('active');
    }

    function switchLetterTab(mode) {
      if (!currentLetterModalData) return;

      const textBtn = document.getElementById('btn-letter-text');
      const photosBtn = document.getElementById('btn-letter-photos');
      const container = document.getElementById('letter-display-container');

      if (!container) return;

      const letterText = currentLetterModalData.Notes || 'No text content provided.';
      const urls = getImageURLs(currentLetterModalData.VideoURL || currentLetterModalData.ThumbnailURL);

      if (mode === 'photos') {
        photosBtn.classList.add('active');
        textBtn.classList.remove('active');
        
        let imagesHTML = '';
        if (urls.length > 0) {
          imagesHTML = urls.map(url => `<img src="${url}" alt="Letter Page" loading="lazy" onerror="this.style.display='none'">`).join('');
        } else {
          imagesHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);">No images attached</div>`;
        }

        container.innerHTML = `
          <div class="letter-photos-view">
            ${imagesHTML}
          </div>
        `;
      } else {
        textBtn.classList.add('active');
        photosBtn.classList.remove('active');
        container.innerHTML = `
          <div class="letter-text-view">${letterText}</div>
        `;
      }
    }

    function closeModal(event) {
      if (event && event.stopPropagation) event.stopPropagation();
      const modal = document.getElementById('modal-overlay');
      const body = document.getElementById('modal-body');

      modal.classList.remove('active');
      body.innerHTML = '';
      currentLetterModalData = null;
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadContent();
    });
  </script>
</body>
</html>
